name = "mgrm-hub"
main = "src/index.js"
compatibility_date = "2026-08-20"

routes = [
  { pattern = "hub.mgrm.kr", custom_domain = true }
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
html_handling = "none"

# NAS 가 꺼져 있을 때 제출물을 잠시 보관하는 곳
[[d1_databases]]
binding = "DB"
database_name = "mgrm-hub"
database_id = "여기에_D1_데이터베이스_ID_붙여넣기"

# 10분마다 밀린 제출물을 NAS 로 넘깁니다
[triggers]
crons = ["*/10 * * * *"]
