<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>스크립터 클립 확인 · 맹그라미</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 스크립터 클립 확인 — 업무 허브(hub.mgrm.kr) 공개 페이지
   화면은 색 판단에 방해되지 않게 중립 회색 바탕을 씁니다 */
:root{
  --ink:#0E0E11; --panel:#17171C; --panel2:#1F1F26; --line:#2C2C35; --line2:#3A3A45;
  --text:#F1F0F4; --muted:#9C99A6; --faint:#6E6B78;
  --ok:#3DBE7A; --ok-bg:rgba(61,190,122,.16); --ng:#F0605A; --ng-bg:rgba(240,96,90,.16);
  --keep:#E9A93A; --keep-bg:rgba(233,169,58,.16); --acc:#E8789F; --acc-bg:rgba(232,120,159,.14);
  --sans:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--text)}
button{cursor:pointer}
.hide{display:none!important}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
input:disabled,textarea:disabled{opacity:.75}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:7px 12px;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#1a0d12;font-weight:700}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}

/* 들어가기 */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate__box{width:100%;max-width:360px;text-align:center}
.gate__box img{height:20px;margin-bottom:22px;filter:invert(1)}
.gate__box h1{font-size:20px;margin:0 0 6px}
.gate__box p{color:var(--muted);margin:0 0 22px}
.gate__box input{margin-bottom:10px;text-align:center}
.gate__box .pw{letter-spacing:.2em;font-family:var(--mono)}
.gate__box label{display:flex;align-items:center;justify-content:center;gap:7px;color:var(--muted);font-size:13px;margin:4px 0 14px}
.gate__box label input{width:auto;margin:0}
.gate__msg{min-height:20px;color:var(--ng);font-size:13px;margin-top:10px}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:rgba(14,14,17,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top__t{flex:1;min-width:160px}
.top__t b{font-size:15px}
.top__t div{font-size:12px;color:var(--muted)}
.role{font-size:11px;padding:2px 8px;border-radius:6px;margin-left:6px;vertical-align:2px}
.role.s{background:var(--acc-bg);color:var(--acc)}
.role.v{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.top select{width:auto;max-width:200px;padding:6px 8px;font-size:13px}
.top .btn{padding:6px 10px}

.wrap{max-width:1400px;margin:0 auto;padding:12px 16px 40px}
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.stat span{font-size:11.5px;color:var(--muted)}
.stat b{display:block;font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat.on{border-color:var(--acc)}
.c-ok{color:var(--ok)!important}.c-ng{color:var(--ng)!important}.c-keep{color:var(--keep)!important}

.main{display:grid;grid-template-columns:330px minmax(0,1fr);gap:14px;align-items:start}
.side{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;position:sticky;top:70px;
  max-height:calc(100vh - 86px);display:flex;flex-direction:column}
.side__head{padding:10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 9px;border-radius:6px;border:1px solid var(--line2);background:transparent;color:var(--muted)}
.chip.on{background:var(--panel2);color:var(--text);border-color:var(--muted)}
.list{overflow:auto;flex:1}
.grp{position:sticky;top:0;background:#202028;font-size:11.5px;color:var(--muted);padding:5px 10px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);z-index:1}
.row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--acc-bg);box-shadow:inset 3px 0 0 var(--acc)}
.row__m{flex:1;min-width:0}
.row__t{font-weight:600;font-size:13.5px}
.row__t.blank{color:var(--keep);font-weight:500}
.row__s{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__c{font-size:11px;color:var(--muted)}
.bd{font-size:11px;padding:2px 7px;border-radius:5px;min-width:40px;text-align:center;font-weight:600}
.bd.ok{background:var(--ok-bg);color:var(--ok)}.bd.ng{background:var(--ng-bg);color:var(--ng)}
.bd.keep{background:var(--keep-bg);color:var(--keep)}.bd.none{background:var(--panel2);color:var(--faint);font-weight:400}
.empty{padding:20px 12px;color:var(--muted);font-size:13px;text-align:center;line-height:1.7}

.stage{min-width:0}
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block;background:#000}
.player__none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint)}
/* 워터마크: 들어온 사람 이름 + 날짜. 캡처하면 같이 찍힙니다 (화면 클릭은 영상으로 그대로 통과) */
.wm{position:absolute;pointer-events:none;user-select:none;-webkit-user-select:none;font-weight:700;letter-spacing:.04em;
  color:#fff;opacity:var(--wmo,.12);white-space:nowrap;font-size:clamp(13px,2.2vw,22px);text-shadow:0 0 2px rgba(0,0,0,.6);
  transition:left 1.2s ease,top 1.2s ease;z-index:2}
.fsb{position:absolute;right:10px;top:10px;z-index:3;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);
  color:#eee;border-radius:7px;padding:4px 9px;font-size:12px;opacity:.75}
.fsb:hover{opacity:1}
.player:fullscreen,.player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0}
.player:fullscreen video,.player:-webkit-full-screen video{object-fit:contain}
.player:fullscreen .wm,.player:-webkit-full-screen .wm{font-size:clamp(18px,2.2vw,30px)}
.info{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:10px 0 8px}
.info__clip{font-family:var(--mono);font-size:15px;font-weight:600}
.info__tc{font-family:var(--mono);font-size:15px;color:var(--acc);margin-left:auto}
.info__m{font-size:12px;color:var(--muted);width:100%}
.mnav{display:none;width:100%;gap:8px}.mnav .btn{flex:1}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.sct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sct label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:3px}
.sct input{font-size:18px;text-align:center;font-weight:600;padding:8px 6px;font-variant-numeric:tabular-nums}
.sct input.sug{color:var(--faint);font-style:italic;font-weight:400}
.hint{font-size:12px;color:var(--faint);margin:6px 0 10px;min-height:18px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.big{height:48px;border-radius:10px;font-size:16px;font-weight:700;background:transparent;border:1.5px solid}
.big small{font-size:11px;font-weight:400;opacity:.6;margin-left:4px}
.big.ok{border-color:var(--ok);color:var(--ok)}.big.ng{border-color:var(--ng);color:var(--ng)}.big.keep{border-color:var(--keep);color:var(--keep)}
.big.ok.on{background:var(--ok);color:#06210f}.big.ng.on{background:var(--ng);color:#2a0705}.big.keep.on{background:var(--keep);color:#2a1a02}
.vstat{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.vstat .bd{font-size:14px;padding:5px 14px}
.memo{margin-top:10px}
.memo textarea{min-height:56px;resize:vertical;line-height:1.55}
.save{font-size:11.5px;color:var(--faint);text-align:right;margin-top:4px;min-height:16px}
.tip{font-size:11.5px;color:var(--faint);margin-top:8px;line-height:1.7}
.tip kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:4px;padding:0 5px;color:var(--muted)}

.cms{margin-top:12px}
.cms h3{font-size:13px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.cm{padding:8px 0;border-bottom:1px solid var(--line)}
.cm:last-of-type{border-bottom:0}
.cm__h{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.cm__h b{color:var(--text);font-weight:600}
.cm__h button{margin-left:auto;background:none;border:0;color:var(--faint);font-size:12px;padding:0}
.cm__t{white-space:pre-wrap;word-break:break-word;margin-top:2px}
.compose{display:flex;gap:8px;margin-top:8px}
.compose textarea{min-height:40px;height:40px;resize:none;flex:1}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2A2A33;border:1px solid var(--line2);
  padding:10px 16px;border-radius:10px;font-size:13px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.bad{border-color:var(--ng);color:#ffb3af}
.foot{text-align:center;color:var(--faint);font-size:11px;margin-top:30px}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;max-height:none;order:2}
  .list{max-height:60vh}
  .stage{order:1}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .tip{display:none}
  .mnav{display:flex}
}
</style>
</head>
<body>

<!-- 들어가기 -->
<div class="gate" id="gate">
  <div class="gate__box">
    <img src="logo.png" alt="맹그라미">
    <h1 id="gTitle">스크립터 클립 확인</h1>
    <p id="gSub">안내받은 이름과 비밀번호를 적어 주세요.</p>
    <input id="gName" placeholder="이름" autocomplete="username" maxlength="40">
    <input id="gPw" class="pw" type="password" placeholder="비밀번호 (숫자)" inputmode="numeric" autocomplete="current-password">
    <label><input type="checkbox" id="gRemember"> 이 기기에서 비밀번호 기억</label>
    <button class="btn pri" id="gGo" style="width:100%;padding:11px">들어가기</button>
    <div class="gate__msg" id="gMsg"></div>
    <p style="font-size:12px;color:var(--faint);margin:14px 0 0;line-height:1.6">접속과 재생 기록이 남고, 화면에 이름이 표시돼요.<br>링크와 비밀번호는 본인만 써 주세요.</p>
  </div>
</div>

<!-- 본 화면 -->
<div id="app" class="hide">
  <div class="top">
    <div class="top__t"><b id="tTitle"></b><span class="role" id="tRole"></span>
      <div><span id="tName"></span> · <a href="#" id="tOut" style="color:inherit">나가기</a></div></div>
    <select id="range" aria-label="회차"></select>
    <button class="btn" id="btnRefresh" title="새로 올린 클립 불러오기">새로고침</button>
    <button class="btn hide" id="btnCsv">CSV 내려받기</button>
  </div>

  <div class="wrap">
    <div class="stats" id="stats"></div>
    <div class="main">
      <aside class="side">
        <div class="side__head">
          <input id="q" placeholder="찾기: 12, S#12, A002C003" autocomplete="off">
          <select id="sort" aria-label="정렬">
            <option value="time">촬영 순서</option>
            <option value="scene">씬별 (S# → 컷 → 테이크)</option>
            <option value="day">회차·날짜별 (최근 회차 위로)</option>
          </select>
          <div class="chips" id="chips">
            <button class="chip on" data-f="all">전체</button><button class="chip" data-f="ok">OK</button>
            <button class="chip" data-f="ng">NG</button><button class="chip" data-f="keep">KEEP</button>
            <button class="chip" data-f="none">미확인</button><button class="chip" data-f="blank">씬 미입력</button>
            <button class="chip" data-f="cm">코멘트</button>
          </div>
        </div>
        <div class="list" id="list"></div>
      </aside>

      <section class="stage">
        <div class="player" id="player">
          <video id="v" controls playsinline preload="metadata" controlsList="nodownload nofullscreen noremoteplayback" disableRemotePlayback disablePictureInPicture></video>
          <div class="player__none" id="vNone">왼쪽 목록에서 클립을 고르세요</div>
          <div class="wm" id="wm1"></div><div class="wm" id="wm2"></div>
          <button class="fsb" id="fsBtn" type="button" title="전체 화면 (F)">⛶ 전체 화면</button>
        </div>
        <div class="info">
          <span class="info__clip" id="iClip">—</span>
          <span class="bd none" id="iBadge">—</span>
          <span class="info__tc" id="iTc"></span>
          <span class="info__m" id="iMeta"></span>
          <span class="mnav"><button class="btn" id="bPrev">◀ 이전 클립</button><button class="btn" id="bNext">다음 클립 ▶</button></span>
        </div>

        <div class="panel">
          <div class="sct">
            <div><label for="fS">씬 S#</label><input id="fS" inputmode="numeric" autocomplete="off" maxlength="8"></div>
            <div><label for="fC">컷 C</label><input id="fC" inputmode="numeric" autocomplete="off" maxlength="8"></div>
            <div><label for="fT">테이크 T</label><input id="fT" inputmode="numeric" autocomplete="off" maxlength="8"></div>
          </div>
          <div class="hint" id="hint"></div>
          <div class="acts" id="acts">
            <button class="big ok" data-st="ok">OK<small>1</small></button>
            <button class="big ng" data-st="ng">NG<small>2</small></button>
            <button class="big keep" data-st="keep">KEEP<small>3</small></button>
          </div>
          <div class="vstat hide" id="vstat">스크립터 표시 <span class="bd none" id="vBadge">미확인</span></div>
          <div class="memo">
            <label for="fMemo" class="dim" style="font-size:11.5px">스크립터 메모</label>
            <textarea id="fMemo" placeholder="예: 대사 NG, 소품 위치 바뀜" maxlength="1000"></textarea>
            <div class="save" id="saveMsg"></div>
          </div>
          <div class="tip" id="tip"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> OK·NG·KEEP (누르면 저장되고 다음 클립으로) ·
            <kbd>↑</kbd><kbd>↓</kbd> 이전·다음 클립 · <kbd>Space</kbd> 재생·정지 · <kbd>←</kbd><kbd>→</kbd> 2초 이동 · <kbd>F</kbd> 전체 화면</div>
        </div>

        <div class="panel cms">
          <h3>코멘트 <span class="dim" id="cmN"></span></h3>
          <div id="cmList"></div>
          <div class="compose">
            <textarea id="cmTxt" placeholder="이 클립에 코멘트 남기기" maxlength="1000"></textarea>
            <button class="btn pri" id="cmSend">남기기</button>
          </div>
        </div>
      </section>
    </div>
    <div class="foot">맹그라미 · 스크립터 클립 확인 · 영상은 내려받을 수 없어요</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
'use strict';
const ENDPOINT = '/api/public';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = new URLSearchParams(location.search).get('p') || '';
const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const SS = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
const LABEL = { ok: 'OK', ng: 'NG', keep: 'KEEP' };


const S = { pw: '', role: '', name: LS.get('scr:name:' + P) || '', title: '', base: '', days: [], clips: [], marks: {}, comments: [],
  sig: '', sel: '', range: '', sort: 'time', filt: 'all', q: '', dirty: false, sug: false, list: [] };
const view = (() => { try { return JSON.parse(LS.get('scr:view:' + P) || '{}'); } catch { return {}; } })();
if (view.sort) S.sort = view.sort;
const saveView = () => LS.set('scr:view:' + P, JSON.stringify({ sort: S.sort, range: S.range }));

function toast(t, bad) {
  const el = $('toast'); el.textContent = t; el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast'; }, 2200);
}
async function call(action, body) {
  let r;
  try {
    r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action, p: P, name: S.name, pw: S.pw }, body || {})) });
  } catch { throw new Error('인터넷 연결을 확인해 주세요.'); }
  let j; try { j = await r.json(); } catch { throw new Error('서버 응답을 읽지 못했어요.'); }
  if (j.nas === 'down') throw new Error('NAS에 연결할 수 없어요. 잠시 뒤 다시 해 주세요.');
  return j;
}
const ERR = { none: '없는 링크예요. 링크를 다시 확인해 주세요.', off: '지금은 닫혀 있는 페이지예요.',
  expired: '기간이 끝난 페이지예요.', pw: '이름 또는 비밀번호가 맞지 않아요. 안내받은 그대로 적어 주세요.' };
const errText = (j) => j.error === 'locked' ? `비밀번호를 여러 번 틀려서 ${j.min}분 동안 잠겼어요.` : (ERR[j.error] || j.error || '문제가 생겼어요.');

/* ───────── 들어가기 */
(async function boot() {
  if (!P) { $('gSub').textContent = '링크에 페이지 정보가 없어요.'; $('gGo').disabled = true; return; }
  $('gName').value = S.name;
  try {
    const m = await call('scripter.meta');
    if (!m.ok) { $('gSub').textContent = errText(m); $('gGo').disabled = true; return; }
    $('gTitle').textContent = m.title || '스크립터 클립 확인';
    document.title = (m.title ? m.title + ' · ' : '') + '스크립터 클립 확인';
  } catch (e) { $('gSub').textContent = e.message; }
  const saved = S.name && (SS.get('scr:pw:' + P) || LS.get('scr:pw:' + P));
  if (saved && S.name) { S.pw = saved; if (await open(true)) return; }
  (S.name ? $('gPw') : $('gName')).focus();
})();
$('gGo').onclick = () => go();
$('gPw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
$('gName').onkeydown = (e) => { if (e.key === 'Enter') $('gPw').focus(); };
async function go() {
  const name = $('gName').value.trim(), pw = $('gPw').value.trim();

/* ───────── 받은 자료 정리 */

/* ───────── 목록 */
const markOf = (c) => (c && S.marks[keyOf(c)]) || {};

function timeCmp(a, b) {
  const da = dayIdx(a), db = dayIdx(b);

  if (a.tcs != null && b.tcs != null && a.tcs !== b.tcs) return a.tcs - b.tcs;
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}
function cmCount(c) { return S.comments.filter((x) => x.d === c.d && x.clip === c.id).length; }
function inRange(c) { return S.range === 'all' || c.d === S.range; }
function computeList() {
  const q = S.q.trim().toLowerCase().replace(/^s#?/, 's#');
  let arr = S.clips.filter(inRange).map((c) => ({ c, m: markOf(c) }));
  if (S.filt === 'blank') arr = arr.filter((x) => blank(x.m));
  else if (S.filt === 'none') arr = arr.filter((x) => !x.m.st);
  else if (S.filt === 'cm') arr = arr.filter((x) => cmCount(x.c) > 0);
  else if (S.filt !== 'all') arr = arr.filter((x) => x.m.st === S.filt);
  if (q) arr = arr.filter((x) => {
    const hay = `${x.c.id} ${x.c.cam}캠 s#${x.m.s || ''} c${x.m.c || ''} t${x.m.t || ''} ${x.m.memo || ''}`.toLowerCase();
    return /^\d+$/.test(q) ? String(x.m.s || '') === q || x.c.id.toLowerCase().includes(q) : hay.includes(q);
  });
  if (S.sort === 'scene') arr.sort((a, b) => (nOf(a.m.s) - nOf(b.m.s)) || String(a.m.s || '').localeCompare(String(b.m.s || '')) ||
    (nOf(a.m.c) - nOf(b.m.c)) || (nOf(a.m.t) - nOf(b.m.t)) || (a.c.cam < b.c.cam ? -1 : a.c.cam > b.c.cam ? 1 : 0) || timeCmp(a.c, b.c));
  else if (S.sort === 'day') arr.sort((a, b) => (dayIdx(b.c) - dayIdx(a.c)) || timeCmp(a.c, b.c));

}

}

  if (!S.list.length) { L.innerHTML = '<div class="empty">조건에 맞는 클립이 없어요.</div>'; return; }

  let last = null, html = '';

    const d = S.dayBy[c.d];

$('list').onclick = (e) => { const r = e.target.closest('.row'); if (r) select(r.dataset.k); };

/* ───────── 클립 보기 */
const clipBy = (k) => S.clips.find((c) => keyOf(c) === k);

  const el = document.querySelector(`#list .row[data-k="${CSS.escape(k)}"]`);

  const same = S.clips.filter((x) => x.d === c.d).sort(timeCmp);
  const i = same.findIndex((x) => keyOf(x) === keyOf(c));

    const p = same[j], m = markOf(p);

    if (together) return { s: m.s, c: m.c, t: m.t, why: `같은 시각에 찍힌 ${p.cam}캠 ${p.id}와 같은 테이크로 채웠어요.` };
    const tn = parseInt(m.t, 10);
    return { s: m.s, c: m.c, t: isNaN(tn) ? '' : String(tn + 1), why: `앞 클립(${p.id}) 다음 테이크로 채웠어요. 새 컷이면 컷 번호만 고치세요.` };

const fmtDur = (s) => { s = Math.round(s || 0); return s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`; };

/* ───────── 표시·저장 (스크립터) */
let saveT = 0;

  S.marks[k] = m;

    const j = await call('scripter.mark', { d: c.d, clip: c.id, s: m.s, c: m.c, t: m.t, st: m.st, memo: m.memo });
    if (!j.ok) throw new Error(errText(j));

async function mark(st) {

/* ───────── 타임코드 표시 (시작 TC + 재생 위치) */

  const [h, m, s, f] = c.tc.split(/[:;]/).map(Number);

  const p = (n) => String(n).padStart(2, '0');

}

}
function moveWm() {
  // 두 개를 서로 반대쪽 칸에 둡니다 (가운데는 피함)
  const spots = [[6, 8], [62, 8], [6, 78], [62, 78], [34, 10], [34, 80], [6, 44], [66, 44]];
  const a = Math.floor(Math.random() * spots.length), b = (a + 3 + Math.floor(Math.random() * 3)) % spots.length;
  [[ 'wm1', spots[a]], ['wm2', spots[b]]].forEach(([id, [x, y]]) => {
    $(id).style.left = (x + Math.random() * 6) + '%'; $(id).style.top = (y + Math.random() * 6) + '%';
  });
}

/* ───────── 전체 화면: 워터마크까지 같이 키웁니다 (아이폰은 영상만 커져서 번인 글자만 남아요) */
function toggleFs() {
  const el = $('player'), v = $('v');
  const cur = document.fullscreenElement || document.webkitFullscreenElement;
  if (cur) { (document.exitFullscreen || document.webkitExitFullscreen).call(document); return; }
  if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
}
$('fsBtn').onclick = toggleFs;
$('v').addEventListener('dblclick', (e) => { e.preventDefault(); toggleFs(); });
const fsLabel = () => { $('fsBtn').textContent = (document.fullscreenElement || document.webkitFullscreenElement) ? '⤢ 작게' : '⛶ 전체 화면'; };
document.addEventListener('fullscreenchange', fsLabel);
document.addEventListener('webkitfullscreenchange', fsLabel);

/* ───────── 단축키 */
document.addEventListener('keydown', (e) => {
  if ($('app').classList.contains('hide')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const v = $('v');
  if (['1', '2', '3'].includes(e.key) && S.role === 'scripter') { e.preventDefault(); mark(['ok', 'ng', 'keep'][Number(e.key) - 1]); }
  else if (e.key === 'ArrowDown' || e.key === 'j' || e.key === 'ArrowUp' || e.key === 'k') {
    e.preventDefault();
    step((e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1);
  }
  else if (e.key === ' ') { e.preventDefault(); if (v.paused) v.play().catch(() => {}); else v.pause(); }
  else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleFs(); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); v.currentTime = Math.max(0, v.currentTime + (e.key === 'ArrowLeft' ? -2 : 2)); }
});

/* ───────── 머리 버튼 */
$('btnRefresh').onclick = async () => {
  $('btnRefresh').disabled = true;
  try { if (S.dirty) await flush(); const j = await call('scripter.open', { fresh: true }); if (!j.ok) throw new Error(errText(j)); apply(j, true); toast('최신 목록으로 불러왔어요.'); }
  catch (e) { toast(e.message, true); }
  finally { $('btnRefresh').disabled = false; }
};
$('btnCsv').onclick = async () => {
  try {
    if (S.dirty) await flush();
    const j = await call('scripter.csv', { d: S.range === 'all' ? '' : S.range });
    if (!j.ok) throw new Error(errText(j));
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([j.csv], { type: 'text/csv;charset=utf-8' }));
    a.download = j.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (e) { toast(e.message, true); }
};
$('tOut').onclick = async (e) => {
  e.preventDefault();
  if (S.dirty) await flush();
  try { sessionStorage.removeItem('scr:pw:' + P); } catch {}
  LS.del('scr:pw:' + P);
  location.reload();
};

/* ───────── 10초마다 다른 사람이 표시한 내용 가져오기 */
let pollT = 0, polling = false;
function startPoll() { clearInterval(pollT); pollT = setInterval(poll, 10000); }
async function poll() {
  if (document.hidden || polling) return;
  polling = true;
  try {
    const j = await call('scripter.sync', { sig: S.sig });
    if (j.ok) apply(j, !!j.clips);
    else if (j.error === 'pw' || j.error === 'off' || j.error === 'expired') { clearInterval(pollT); toast(errText(j) + ' 다시 들어와 주세요.', true); }
  } catch {} finally { polling = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.role) poll(); });
window.addEventListener('beforeunload', (e) => { if (S.dirty) { flush(); e.preventDefault(); e.returnValue = ''; } });
</script>
