<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>키컷 리뷰 · 맹그라미</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<style>
/* 키컷 리뷰 — 업무 허브(hub.mgrm.kr) 공개 페이지
   테이크 체크와 같은 명단·비밀번호. 그림을 보는 영역은 18% 그레이(#767676), 나머지는 어둡게 */
:root{
  --ink:#111113; --panel:#18181B; --panel2:#202024; --line:#2A2A2F; --line2:#38383F;
  --text:#E9E9EC; --muted:#8B8B93; --faint:#5E5E66;
  --ci:#E84278; --ci-bg:#26161D; --g18:#767676;
  --ok:#3FB37F; --fix:#D9A13B; --ng:#E5534B;
  --sans:'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Montserrat','NanumSquare',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
button{cursor:pointer}
.hide{display:none!important}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ci)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);height:28px;padding:0 10px;font-size:12px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;color:var(--text)}
.btn:hover{border-color:var(--line2);background:#26262B}
.btn.pri{background:var(--ci);border-color:var(--ci);color:#fff;font-weight:700}
.btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}

/* 들어가기 */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate__box{width:100%;max-width:320px}
.gate__box .sym{height:18px;display:block;margin-bottom:26px}
.gate__box h1{font-size:19px;font-weight:800;margin:0}
.gate__box .sub{font-family:var(--en);font-size:10px;letter-spacing:.14em;color:var(--muted);margin:3px 0 22px}
.gate__box .lb{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
.gate__box .pw{letter-spacing:.3em;font-family:var(--mono)}
.gate__box .chk{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin:12px 0 14px}
.gate__box .chk input{width:auto;margin:0}
.gate__msg{min-height:18px;color:var(--ng);font-size:12px;margin-top:8px}
.gate__note{font-size:11px;color:var(--faint);margin-top:18px;padding-top:12px;border-top:1px solid var(--line);line-height:1.6}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:10px}
.top .sym{height:14px;flex:none}
.top__t{flex:1;min-width:0;line-height:1.25}
.top__t b{font-size:14px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top__t span{font-family:var(--en);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);white-space:nowrap}
.who i{width:6px;height:6px;border-radius:50%;background:var(--ci)}
.who .r{color:var(--muted)}
.who a{color:var(--faint);text-decoration:none;margin-left:4px}
.who a:hover{color:var(--text)}
.tabs{display:flex;align-items:flex-end;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 0 7px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:12.5px;user-select:none}
.tab b{color:var(--text);font-weight:700;margin-left:5px;font-family:var(--mono);font-size:12px}
.tab.on{color:var(--text);border-color:var(--ci)}
.tab.ok b{color:var(--ok)}.tab.fix b{color:var(--fix)}

.main{display:grid;grid-template-columns:280px minmax(0,1fr);align-items:start;max-width:1600px;margin:0 auto}
.side{border-right:1px solid var(--line);position:sticky;top:45px;height:calc(100vh - 45px - 38px);display:flex;flex-direction:column}
.list{flex:1;overflow-y:auto}
.grp{position:sticky;top:0;background:var(--panel);font-size:11px;color:var(--muted);padding:5px 12px;border-bottom:1px solid var(--line);z-index:1;display:flex;justify-content:space-between}
.row{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:9px;align-items:center;padding:6px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--ci-bg);box-shadow:inset 2px 0 0 var(--ci)}
.row__th{width:72px;height:40px;border-radius:3px;background:var(--g18);overflow:hidden;display:block}
.row__th img{width:100%;height:100%;object-fit:cover;display:block}
.row__m{min-width:0;display:flex;flex-direction:column;gap:1px}
.row__t{font-family:var(--mono);font-size:12.5px;font-weight:600}
.row__s{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd{width:7px;height:7px;border-radius:50%;background:var(--line2)}
.bd.ok{background:var(--ok)}.bd.fix{background:var(--fix)}
.side__foot{border-top:1px solid var(--line);padding:8px}
.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:12px;line-height:1.7}

/* 그림 보는 곳 — 18% 그레이 */
.stage{padding:14px 18px 40px;min-width:0}
.view{background:var(--g18);border-radius:6px;padding:12px;color:#fff;user-select:none;-webkit-user-select:none}
.view:fullscreen,.view:-webkit-full-screen{border-radius:0;padding:18px;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.vbar .slate{font-family:var(--mono);font-weight:600;font-size:15px}
.vbar .meta{font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.82)}
.seg{display:inline-flex;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.28)}
.seg button{background:none;border:0;color:rgba(255,255,255,.78);font-size:11.5px;padding:5px 10px;letter-spacing:.01em}
.seg button:hover{color:#fff}
.seg button.on{background:#f4f4f5;color:#151517;font-weight:700}
.vbtn{background:rgba(0,0,0,.28);border:0;border-radius:4px;color:#fff;height:27px;width:28px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.vbtn svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.5}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr{position:relative;border-radius:4px;overflow:hidden;aspect-ratio:16/9;cursor:pointer;background:rgba(0,0,0,.18)}
.fr img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;-webkit-user-drag:none}
.fr.sel{outline:3px solid var(--ci);outline-offset:-3px}
.fr.drop{outline:3px dashed #fff;outline-offset:-6px}
.fr .none{position:absolute;inset:10px;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,.32);border-radius:3px;color:rgba(255,255,255,.55);font-size:20px;font-weight:300}
.lb{position:absolute;top:8px;left:8px;font-family:var(--en);font-size:10.5px;font-weight:700;letter-spacing:.08em;background:rgba(0,0,0,.72);color:#fff;padding:3px 7px;border-radius:3px;pointer-events:none;z-index:2}
.lb.ci{background:var(--ci)}
.lb .v{font-family:var(--mono);font-weight:400;letter-spacing:0;margin-left:6px;opacity:.8}
.tr{position:absolute;top:8px;right:8px;font-size:12px;font-weight:700;background:rgba(12,12,14,.86);color:#fff;padding:5px 9px;border-radius:4px;
  pointer-events:none;display:inline-flex;align-items:center;gap:6px;z-index:2}
.tr svg{width:13px;height:13px;stroke:#fff;fill:none;stroke-width:1.5}
.no{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;background:var(--ci);color:#fff;font-size:13px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:2px solid #fff;z-index:2}
.wmk{position:absolute;font-weight:800;letter-spacing:.04em;color:#fff;opacity:.16;font-size:clamp(11px,1.5vw,17px);pointer-events:none;white-space:nowrap;z-index:1}
.wipe{position:relative;aspect-ratio:16/9;border-radius:4px;overflow:hidden;background:rgba(0,0,0,.18);cursor:pointer}
.wipe img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;-webkit-user-drag:none}
.wipe .b{clip-path:inset(0 0 0 50%)}
.hd{position:absolute;top:0;bottom:0;width:26px;margin-left:-13px;cursor:ew-resize;z-index:3;touch-action:none}
.hd::before{content:"";position:absolute;left:12px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.hd span{position:absolute;left:5px;top:50%;width:16px;height:30px;margin-top:-15px;border-radius:8px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.45)}
.hint{display:none}
.vers{display:flex;gap:14px;flex-wrap:wrap;margin-top:9px}
.vers:empty{display:none}
.vers .g{display:inline-flex;align-items:center;gap:3px}
.vers .g>span{font-family:var(--en);font-size:10px;font-weight:700;letter-spacing:.08em;color:rgba(255,255,255,.8);margin-right:4px}
.vers button{background:rgba(0,0,0,.28);border:0;border-radius:3px;color:rgba(255,255,255,.8);font-family:var(--mono);font-size:11px;padding:2px 7px}
.vers button.on{background:#f4f4f5;color:#111;font-weight:600}
.vers button i{font-style:normal;margin-left:4px;opacity:.6}
.vers button i:hover{opacity:1;color:var(--ng)}

/* 아래: 승인 · 메모 · 코멘트 */
.lower{margin-top:12px;max-width:920px}
.tool{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.stl{flex:1;min-width:160px;font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:7px}
.stl i{width:7px;height:7px;border-radius:50%;background:var(--line2);flex:none}
.stl.ok i{background:var(--ok)}.stl.fix i{background:var(--fix)}
.stl b{color:var(--text);font-weight:700}
.acts{display:flex;gap:6px}
.acts button{height:30px;padding:0 13px;border-radius:4px;font-weight:700;font-size:12.5px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);display:inline-flex;align-items:center;gap:6px}
.acts button svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.8}
.acts .a-ok.on{background:var(--ok);border-color:var(--ok);color:#0d1a14}
.acts .a-fix.on{background:var(--fix);border-color:var(--fix);color:#1d1406}
.acts button:disabled{display:none}
.memo{padding:10px 0 2px;border-bottom:1px solid var(--line)}
.memo p{margin:0 0 8px;white-space:pre-wrap;line-height:1.6;color:var(--text);padding-left:10px;border-left:2px solid var(--line2)}
.memo textarea{min-height:44px;resize:vertical;margin-bottom:10px;font-size:12.5px}
.box h3{display:none}
.cm{border-bottom:1px solid var(--line);padding:9px 0}
.cm b{font-size:12.5px;font-weight:700}.cm .t{font-size:11px;color:var(--faint);margin-left:6px}
.cm .x{float:right;background:none;border:0;color:var(--faint);font-size:11px}
.cm .x:hover{color:var(--ng)}
.cm p{margin:3px 0 0;white-space:pre-wrap;line-height:1.6}
.cmin{display:flex;gap:6px;margin-top:8px}
.cmin textarea{min-height:38px;height:38px;resize:vertical}
.admin{margin-top:18px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.admin .btn{height:26px;font-size:11.5px;background:transparent}
.keys{position:relative}
.keys__pop{position:absolute;right:0;top:34px;width:220px;background:var(--panel);border:1px solid var(--line2);border-radius:4px;padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:2;z-index:30}
.keys__pop kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--text);margin-right:2px}

/* 가져오기 창 */
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line2);border-radius:8px;padding:0;width:min(760px,94vw);max-height:84vh}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dh{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dh b{flex:1}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:14px}
.cand{border:1px solid var(--line);border-radius:6px;overflow:hidden;cursor:pointer;background:var(--panel2)}
.cand:hover{border-color:var(--ci)}
.cand .th{aspect-ratio:16/9;background:var(--g18)}
.cand .th img{width:100%;height:100%;object-fit:cover;display:block}
.cand div.t{padding:5px 8px;font-family:var(--mono);font-size:11.5px}
.cand div.t span{color:var(--muted);display:block;font-size:10.5px}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);
  padding:8px 14px;border-radius:var(--r);font-size:12px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.bad{border-color:var(--ng);color:#ffb3af}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-top:1px solid var(--line);order:2}
  .list{max-height:60vh}
  .stage{order:1;padding:10px 10px 20px}
  .top{padding:8px 12px;flex-wrap:wrap;position:static}
  .tabs{padding:0 12px;gap:14px}
  .lower{grid-template-columns:1fr}
  .view{padding:8px}
  .lb,.tr{font-size:11px;padding:3px 6px}
}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="gate__box">
    <img class="sym" src="mgrm-symbol.svg" alt="맹그라미">
    <h1 id="gTitle">키컷 리뷰</h1>
    <div class="sub">KEY CUT</div>
    <div id="gSub" class="dim" style="font-size:12px"></div>
    <label class="lb" for="gName">이름</label>
    <input id="gName" autocomplete="username" maxlength="40">
    <label class="lb" for="gPw">비밀번호</label>
    <input id="gPw" class="pw" type="password" inputmode="numeric" autocomplete="current-password">
    <label class="chk"><input type="checkbox" id="gRemember"> 이 기기에서 기억</label>
    <button class="btn pri" id="gGo" style="width:100%;height:36px;justify-content:center">들어가기</button>
    <div class="gate__msg" id="gMsg"></div>
    <div class="gate__note">테이크 체크와 같은 이름·비밀번호입니다.<br>접속 기록이 남고 화면에 이름이 표시됩니다.</div>
  </div>
</div>

<div id="app" class="hide">
  <div class="top">
    <img class="sym" src="mgrm-symbol.svg" alt="맹그라미">
    <div class="top__t"><b id="tTitle"></b><span>KEY CUT</span></div>
    <span class="who"><i></i><span id="tName"></span><span class="r" id="tRole"></span><a href="#" id="tOut" title="나가기">나가기</a></span>
    <div class="keys"><button class="btn" id="keysBtn" title="단축키" style="width:28px;justify-content:center;padding:0;font-family:var(--en);font-weight:700">?</button>
      <div class="keys__pop hide" id="keysPop"><kbd>1</kbd><kbd>2</kbd><kbd>3</kbd><kbd>4</kbd> 한 장 / 4분할<br><kbd>↑</kbd><kbd>↓</kbd> 이전 · 다음 키컷<br><kbd>F</kbd> 전체 화면<br>둘 비교: 두 칸 고르기 → 화면 누르면 다시</div></div>
    <button class="btn" id="btnRefresh" title="새로 불러오기"><svg viewBox="0 0 12 12"><path d="M10 6a4 4 0 1 1-1.2-2.85M10 1.5v2.5H7.5"/></svg></button>
  </div>
  <div class="tabs" id="stats"></div>
  <div class="main">
    <aside class="side">
      <div class="list" id="list"></div>
      <div class="side__foot hide" id="adminFoot"><button class="btn" id="btnCands" style="width:100%;justify-content:center;background:transparent">+ OK컷 가져오기</button></div>
    </aside>
    <section class="stage">
      <div class="view" id="view">
        <div class="vbar">
          <span class="slate" id="vSlate">—</span>
          <span class="meta" id="vMeta"></span>
          <span style="margin-left:auto;display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center">
            <span class="seg hide" id="how"><button data-h="wipe">와이프</button><button data-h="side">나란히</button></span>
            <span class="seg" id="mode"><button data-m="view">보기</button><button data-m="ab">둘 비교</button></span>
            <button class="vbtn" id="fsBtn" title="전체 화면 (F)"><svg viewBox="0 0 12 12"><path d="M1.5 4.5v-3h3M10.5 4.5v-3h-3M1.5 7.5v3h3M10.5 7.5v3h-3"/></svg></button>
          </span>
        </div>
        <div id="pane"></div>
        <div class="hint" id="hint"></div>
        <div class="vers" id="vers"></div>
      </div>

      <div class="lower" id="lower">
        <div class="tool">
          <span class="stl" id="stLine"></span>
          <div class="acts">
            <button class="a-ok" id="bOk"><svg viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3L9.5 3.5"/></svg>승인</button>
            <button class="a-fix" id="bFix"><svg viewBox="0 0 12 12"><path d="M2.5 9.5l1-3 5-5 2 2-5 5z"/></svg>수정 요청</button>
          </div>
        </div>
        <div class="memo" id="memoBox">
          <p id="memoText"></p>
          <textarea id="memoIn" class="hide" placeholder="방향 메모 (모두에게 보여요)"></textarea>
        </div>
        <div class="box">
          <h3>코멘트 <span id="cmN" class="mono"></span></h3>
          <div id="cms"></div>
          <div class="cmin"><textarea id="cmIn" placeholder="코멘트"></textarea><button class="btn pri" id="cmGo" style="height:38px">남기기</button></div>
        </div>
      </div>

      <div class="admin hide" id="adminBar">
        <button class="btn" id="bUp" title="파일 이름 끝 _LOG _709 _LUT _GRADE 로 칸을 찾아요. 칸에 직접 끌어다 놓아도 돼요.">스틸 올리기</button>
        <button class="btn" id="btnCands2">OK컷 가져오기</button>
        <button class="btn" id="bRemove" style="margin-left:auto;color:#ffb3af">키컷 빼기</button>
        <input type="file" id="fileIn" accept="image/jpeg,image/png,image/webp,image/tiff,.tif,.tiff" multiple class="hide">
      </div>
    </section>
  </div>
</div>

<dialog id="candDlg">
  <div class="dh"><b>테이크 체크 OK컷에서 가져오기</b><span class="dim" style="font-size:12px">누르면 키컷이 돼요</span><button class="btn" id="candClose">닫기</button></div>
  <div class="cands" id="cands"></div>
</dialog>
<div class="toast" id="toast"></div>

<script>
'use strict';
const $ = (id) => document.getElementById(id);

function toast(t, bad) { const el = $('toast'); el.textContent = t; el.className = 'toast on' + (bad ? ' bad' : ''); clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast'; }, 2400); }
async function call(action, body) {

  try { r = await fetch('/api/public', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin',
    body: JSON.stringify(Object.assign({ action, p: P, name: S.name, pw: S.pw }, body || {})) }); }
  catch { throw new Error('인터넷 연결을 확인해 주세요.'); }
  let j; try { j = await r.json(); } catch { throw new Error('서버 응답을 읽지 못했어요.'); }
  if (j.nas === 'down') throw new Error('NAS에 연결할 수 없어요. 잠시 뒤 다시 해 주세요.');
  return j;
}
// 관리자 동작은 허브 로그인 쿠키로 (/api/rpc)
async function rpc(action, body) {

    body: JSON.stringify(Object.assign({ action, key: P }, body || {})) }); }
  catch { throw new Error('인터넷 연결을 확인해 주세요.'); }
  let j; try { j = await r.json(); } catch { throw new Error('서버 응답을 읽지 못했어요.'); }
  if (!j.ok) throw new Error(j.error || '문제가 생겼어요.');
  return j;
}
const ERR = { none: '없는 링크예요. 링크를 다시 확인해 주세요.', off: '지금은 닫혀 있는 페이지예요.', expired: '기간이 끝난 페이지예요.',
  pw: '이름 또는 비밀번호가 맞지 않아요.', nokc: '키컷 리뷰를 볼 권한이 없어요. 맹그라미에 요청해 주세요.', login: '' };

/* ───────── 들어가기: 허브 관리자는 바로, 나머지는 이름 + 비밀번호 */

    if (m.admin) { S.name = ''; S.pw = ''; if (await open(true)) return; }
  } catch (e) { $('gSub').textContent = e.message; }
  const saved = S.name && (SS.get('kc:pw:' + P) || LS.get('kc:pw:' + P) || SS.get('scr:pw:' + P) || LS.get('scr:pw:' + P));

$('gGo').onclick = () => go();

  const ok = await open(false);

}

/* ───────── 받은 자료 */

  if (S.first) { S.first = false; const k = cur(); if (k && canApprove() && !isAdmin() && latest(k, 'lut') && latest(k, 'gr')) { S.mode = 'ab'; S.cmp = ['lut', 'gr']; } }
  renderStats(); renderList(); renderStage();
}
const cur = () => S.cuts.find((k) => k.id === S.sel);

function renderStats() {

}
$('stats').onclick = (e) => { const t = e.target.closest('.tab'); if (t) { S.filt = t.dataset.f; renderStats(); renderList(); } };
function thumbOf(k) {

  return null;
}
function renderList() {

      `<span class="row__m"><span class="row__t">${esc(slate(k))}</span><span class="row__s">${esc(k.clip)}${ncm ? ` · <svg viewBox="0 0 12 12" style="width:10px;height:10px;stroke:currentColor;fill:none;stroke-width:1.3;vertical-align:-1px"><path d="M2 2.5h8v5.5H5L3 10V8H2z"/></svg> ${ncm}` : ''}</span></span>` +

// 휴대폰(목록이 아래)에서는 키컷을 누르면 그림으로 올라감
$('list').onclick = (e) => {

function select(id) {
  if (S.memoDirty) saveMemo();

/* ───────── 그림 보기: 보기(4분할 ↔ 한 장) · 둘 비교(와이프 · 나란히) */
function wmText() {

  return [S.me, S.org, `${d.getUTCMonth() + 1}/${d.getUTCDate()} ${p(d.getUTCHours())}:${p(d.getUTCMinutes())}`].filter(Boolean).join(' · ');
}
const WM = () => `<span class="wmk" style="left:6%;top:66%">${esc(wmText())}</span><span class="wmk" style="right:6%;top:20%">${esc(wmText())}</span>`;
const IC_GRID = '<svg viewBox="0 0 12 12"><path d="M1.5 1.5h4v4h-4zM6.5 1.5h4v4h-4zM1.5 6.5h4v4h-4zM6.5 6.5h4v4h-4z"/></svg>';
function frame(k, sl, corner, cls) {

  const img = v ? `<img alt="" src="${esc(url(v.f))}">` : `<span class="none" title="${isAdmin() ? '끌어다 놓거나 눌러서 올리기' : '아직 없음'}">${isAdmin() ? '+' : ''}</span>`;
  return `<div class="fr${cls ? ' ' + cls : ''}" data-slot="${sl}" title="${esc(SLOT_KO[sl])}">${img}<span class="lb${sl === 'gr' ? ' ci' : ''}">${SLOT_N[sl]}${v && nv > 1 ? `<span class="v">v${v.n}</span>` : ''}</span>${corner || ''}${v ? WM() : ''}</div>`;
}
function renderStage() {

  } else {

    if (S.how === 'wipe') {
      pane.innerHTML = `<div class="wipe" id="cmpbox">${va ? `<img alt="" src="${esc(url(va.f))}">` : ''}${vb ? `<img class="b" alt="" src="${esc(url(vb.f))}" style="clip-path:inset(0 0 0 ${S.wx}%)">` : ''}` +

$('vers').onclick = async (e) => {
  const b = e.target.closest('button'); if (!b) return;
  const k = cur(), sl = b.dataset.sl, n = Number(b.dataset.n);
  if (e.target.dataset.del) {
    if (!confirm(`${SLOT_N[sl]} v${n} 을 지울까요? 파일도 지워져요.`)) return;
    try { await rpc('keycut.delver', { id: k.id, slot: sl, n }); await reload(); toast('지웠어요.'); } catch (er) { toast(er.message, true); }

let dragging = false;
$('pane').addEventListener('click', (e) => {

  const f = e.target.closest('.fr[data-slot]'); if (!f) return;
  const sl = f.dataset.slot, has = !!latest(k, sl);

  if (S.mode === 'view') { S.one = S.one ? null : sl; renderStage(); return; }
  const i = S.picks.indexOf(sl); if (i >= 0) S.picks.splice(i, 1); else S.picks.push(sl);

$('pane').addEventListener('pointerdown', (e) => {

    $('hd').style.left = S.wx + '%';

function toggleFs() {

$('keysBtn').onclick = (e) => { e.stopPropagation(); $('keysPop').classList.toggle('hide'); };
document.addEventListener('click', (e) => { if (!e.target.closest('.keys')) $('keysPop').classList.add('hide'); });
document.addEventListener('keydown', (e) => {
  if ($('app').classList.contains('hide')) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = cur();
  if (['1', '2', '3', '4'].includes(e.key) && k) {
    const sl = SLOTS[Number(e.key) - 1].k; if (!latest(k, sl)) return;

  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'j' || e.key === 'k') {
    e.preventDefault(); const rows = [...document.querySelectorAll('#list .row')]; const i = rows.findIndex((r) => Number(r.dataset.id) === S.sel);
    const n = rows[Math.max(0, Math.min(rows.length - 1, i + ((e.key === 'ArrowDown' || e.key === 'j') ? 1 : -1)))]; if (n) { select(Number(n.dataset.id)); n.scrollIntoView({ block: 'nearest' }); }
  }
});

/* ───────── 승인 · 메모 · 코멘트 */
function renderLower(k) {
  $('bOk').classList.toggle('on', k.st === 'ok'); $('bFix').classList.toggle('on', k.st === 'fix');
  $('bOk').disabled = $('bFix').disabled = !canApprove();
  $('bOk').title = $('bFix').title = canApprove() ? '' : '승인 권한이 있는 사람만 누를 수 있어요';
  $('stLine').className = 'stl ' + (k.st || '');
  $('stLine').innerHTML = k.st ? `<i></i><b>${esc(ST_N[k.st])}</b><span>${esc(k.stBy)} · ${esc(k.stAt.slice(5))}</span>` : '<i></i><span>확인 전</span>';
  $('memoText').textContent = k.memo || '';
  $('memoText').classList.toggle('hide', isAdmin() || !k.memo);
  $('memoIn').classList.toggle('hide', !isAdmin());
  if (isAdmin() && document.activeElement !== $('memoIn')) { $('memoIn').value = k.memo || ''; S.memoDirty = false; }
  $('memoBox').classList.toggle('hide', !isAdmin() && !k.memo);
  const cms = S.comments.filter((c) => c.kc === k.id);
  $('cmN').textContent = cms.length || '';
  $('memoBox').classList.toggle('hide', !isAdmin() && !k.memo);
  $('cms').innerHTML = cms.map((c) => `<div class="cm"><b>${esc(c.who)}</b><span class="t">${esc(c.at.slice(5))}</span>` +
    ((isAdmin() || c.who === S.me) ? `<button class="x" data-cid="${c.id}">지우기</button>` : '') + `<p>${esc(c.txt)}</p></div>`).join('');
}
async function setSt(st) {
  const k = cur(); if (!k || !canApprove()) return;
  const next = k.st === st ? '' : st;
  try { const j = await call('keycut.status', { id: k.id, st: next }); if (!j.ok) throw new Error(errText(j)); await reload(); toast(next ? ST_N[next] + '로 표시했어요.' : '표시를 지웠어요.'); }
  catch (e) { toast(e.message, true); }
}
$('bOk').onclick = () => setSt('ok'); $('bFix').onclick = () => setSt('fix');
$('cmGo').onclick = async () => {
  const k = cur(), t = $('cmIn').value.trim(); if (!k || !t) return;
  $('cmGo').disabled = true;
  try { const j = await call('keycut.comment', { id: k.id, txt: t }); if (!j.ok) throw new Error(errText(j)); $('cmIn').value = ''; await reload(); }
  catch (e) { toast(e.message, true); } finally { $('cmGo').disabled = false; }
};
$('cmIn').onkeydown = (e) => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) $('cmGo').click(); };
$('cms').onclick = async (e) => {
  const b = e.target.closest('[data-cid]'); if (!b || !confirm('이 코멘트를 지울까요?')) return;
  try { const j = await call('keycut.uncomment', { cid: Number(b.dataset.cid) }); if (!j.ok) throw new Error(errText(j)); await reload(); } catch (er) { toast(er.message, true); }
};
$('memoIn').oninput = () => { S.memoDirty = true; };
$('memoIn').onblur = () => { if (S.memoDirty) saveMemo(); };
async function saveMemo() {
  const k = cur(); if (!k) return; S.memoDirty = false;
  try { await rpc('keycut.memo', { id: k.id, memo: $('memoIn').value }); k.memo = $('memoIn').value; toast('메모를 저장했어요.'); } catch (e) { toast(e.message, true); }
}
async function reload() { const j = await call('keycut.open'); if (j.ok) apply(j); }

/* ───────── 관리: OK컷 가져오기 · 스틸 올리기 · 빼기 */
$('btnCands').onclick = () => {
  $('cands').innerHTML = S.cands.length ? S.cands.map((c, i) => `<div class="cand" data-i="${i}"><div class="th">${c.th ? `<img loading="lazy" alt="" src="${esc(S.takeBase + c.th)}">` : ''}</div>` +
    `<div class="t">${esc([c.s, c.c, c.t].filter(Boolean).join('-') || '씬 미입력')}<span>${esc(c.clip)}${c.tc ? ' · ' + esc(c.tc.slice(0, 8)) : ''}</span></div></div>`).join('')
    : '<div class="empty" style="grid-column:1/-1">가져올 OK컷이 없어요.<br>테이크 체크에서 OK로 표시한 클립이 여기에 나와요.</div>';
  $('candDlg').showModal();
};
$('candClose').onclick = () => $('candDlg').close();
$('btnCands2').onclick = () => $('btnCands').click();
$('candDlg').addEventListener('click', (e) => { if (e.target === $('candDlg')) $('candDlg').close(); });
$('cands').onclick = async (e) => {
  const el = e.target.closest('.cand'); if (!el) return;
  const c = S.cands[Number(el.dataset.i)];
  try { const j = await rpc('keycut.add', { d: c.d, clip: c.clip }); el.remove(); S.cands.splice(Number(el.dataset.i), 1); await reload(); S.sel = j.id; renderList(); renderStage(); toast('키컷으로 넣었어요.'); }
  catch (er) { toast(er.message, true); }
};
$('bRemove').onclick = async () => {
  const k = cur(); if (!k || !confirm(`${slate(k)} 키컷을 뺄까요? 올린 스틸과 코멘트도 함께 지워져요 (스틸은 NAS 휴지통으로).`)) return;
  try { await rpc('keycut.remove', { id: k.id }); S.sel = 0; await reload(); toast('뺐어요.'); } catch (e) { toast(e.message, true); }
};
let pickSlot = '';
function pickFile(sl) { pickSlot = sl || ''; $('fileIn').value = ''; $('fileIn').click(); }
$('bUp').onclick = () => pickFile('');
$('fileIn').onchange = () => upload([...$('fileIn').files], pickSlot);
// 파일 이름으로 칸 찾기: …_LOG / _709 / _LUT / _GRADE (대소문자 무관)
function slotByName(n) {
  const s = n.toUpperCase().replace(/\.[^.]+$/, '');
  if (/(^|[_\-\s.])(GRADE|GRADED|GR|GRADING)(_?V\d+)?$/.test(s)) return 'gr';
  if (/(^|[_\-\s.])(LUT|ONSET|ON-SET)(_?V\d+)?$/.test(s)) return 'lut';
  if (/(^|[_\-\s.])(709|REC709|REC\.709)(_?V\d+)?$/.test(s)) return '709';
  if (/(^|[_\-\s.])(LOG|LOGC|ORIGINAL|RAW)(_?V\d+)?$/.test(s)) return 'log';
  return '';
}
// 큰 파일·TIFF 는 브라우저에서 JPG 로 바꿔 올림 (가로 3840 까지, 품질 92)
async function prep(file) {
  const ok = ['image/jpeg', 'image/png', 'image/webp'].includes(file.type);
  if (ok && file.size <= 8 * 1024 * 1024) return { type: file.type, blob: file };
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { throw new Error(`${file.name}: 이 브라우저가 읽지 못하는 형식이에요. JPG 나 PNG 로 뽑아 주세요.`); }
  const w = Math.min(3840, bmp.width), h = Math.round(bmp.height * (w / bmp.width));
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(bmp, 0, 0, w, h);
  const blob = await new Promise((r) => cv.toBlob(r, 'image/jpeg', 0.92));
  return { type: 'image/jpeg', blob };
}
const b64 = (blob) => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(blob); });
async function upload(files, forced) {
  const k = cur(); if (!k || !files.length) return;
  let done = 0;
  for (const f of files) {
    const sl = files.length === 1 && forced ? forced : (slotByName(f.name) || (files.length === 1 ? forced : ''));
    if (!sl) { toast(`${f.name}: 어느 칸인지 모르겠어요. 이름 끝에 _LOG _709 _LUT _GRADE 를 붙이거나 칸에 끌어다 놓아 주세요.`, true); continue; }
    try {
      toast(`${SLOT_N[sl]} 올리는 중…`);
      const p = await prep(f);
      await rpc('keycut.upload', { id: k.id, slot: sl, type: p.type, data: await b64(p.blob) });
      done++;
    } catch (e) { toast(e.message, true); }
  }
  if (done) { delete S.ver[k.id]; await reload(); toast(`${done}장 올렸어요.`); }
}
// 끌어다 놓기: 칸 위면 그 칸, 다른 곳이면 이름으로
['dragover', 'dragenter'].forEach((ev) => $('view').addEventListener(ev, (e) => {
  if (!isAdmin() || !e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
  e.preventDefault(); document.querySelectorAll('.fr.drop').forEach((x) => x.classList.remove('drop'));
  const f = e.target.closest('.fr[data-slot]'); if (f) f.classList.add('drop');
}));
$('view').addEventListener('dragleave', (e) => { if (!e.relatedTarget || !$('view').contains(e.relatedTarget)) document.querySelectorAll('.fr.drop').forEach((x) => x.classList.remove('drop')); });
$('view').addEventListener('drop', (e) => {
  if (!isAdmin()) return;
  e.preventDefault(); document.querySelectorAll('.fr.drop').forEach((x) => x.classList.remove('drop'));
  const f = e.target.closest('.fr[data-slot]');
  upload([...e.dataTransfer.files].filter((x) => /^image\//.test(x.type) || /\.(tiff?|jpe?g|png|webp)$/i.test(x.name)), f ? f.dataset.slot : '');
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) sync(); });
</script>
