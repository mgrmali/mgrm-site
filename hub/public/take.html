<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>테이크 체크 · 맹그라미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/moonspam/NanumSquare@2.0/nanumsquare.css" rel="stylesheet">
<style>
/* 테이크 체크 — 업무 허브(hub.mgrm.kr) 공개 페이지
   색 판단에 방해되지 않게 중립 회색 바탕, 포인트는 맹그라미 CI 핑크 하나만 */
:root{
  --ink:#111113; --panel:#18181B; --panel2:#202024; --line:#2A2A2F; --line2:#38383F;
  --text:#E9E9EC; --muted:#8B8B93; --faint:#5E5E66;
  --ci:#E84278; --ci-bg:#26161D;
  --ok:#3FB37F; --ng:#E5534B; --keep:#D9A13B;
  --sans:'NanumSquare','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --en:'Montserrat','NanumSquare',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
button{cursor:pointer}
.hide{display:none!important}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:7px 9px;outline:none;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--ci)}
input:disabled,textarea:disabled{opacity:.8}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);height:28px;padding:0 10px;font-size:12px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:5px;color:var(--text)}
.btn:hover{border-color:var(--line2);background:#26262B}
.btn.pri{background:var(--ci);border-color:var(--ci);color:#fff;font-weight:700}
a.btn{text-decoration:none}
#bKcAdd.on{border-color:var(--ci);color:var(--ci)}
.btn svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.en{font-family:var(--en);letter-spacing:.08em}
.mono{font-family:var(--mono)}
.dim{color:var(--muted)}

/* 들어가기 */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.gate__box{width:100%;max-width:320px}
.gate__box .sym{height:18px;display:block;margin-bottom:26px}
.gate__box h1{font-size:19px;font-weight:800;margin:0}
.gate__box .sub{font-family:var(--en);font-size:10px;letter-spacing:.14em;color:var(--muted);margin:3px 0 22px}
.gate__box .lb{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
.gate__box .pw{letter-spacing:.3em;font-family:var(--mono)}
.gate__box .chk{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;margin:12px 0 14px}
.gate__box .chk input{width:auto;margin:0}
.gate__msg{min-height:18px;color:var(--ng);font-size:12px;margin-top:8px}
.gate__note{font-size:11px;color:var(--faint);margin-top:18px;padding-top:12px;border-top:1px solid var(--line);line-height:1.6}

/* 머리 */
.top{position:sticky;top:0;z-index:20;background:var(--ink);border-bottom:1px solid var(--line);
  padding:8px 16px;display:flex;align-items:center;gap:10px}
.top .sym{height:14px;flex:none}
.top__t{flex:1;min-width:0;line-height:1.25}
.top__t b{font-size:14px;font-weight:800;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top__t span{font-family:var(--en);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.top select{width:auto;max-width:190px;height:28px;padding:0 8px;font-size:12px}
.who{display:inline-flex;align-items:center;gap:6px;font-size:12px;height:28px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);white-space:nowrap}
.who i{width:6px;height:6px;border-radius:50%;background:var(--ci)}
.who .r{color:var(--muted)}
.who a{color:var(--faint);text-decoration:none;margin-left:4px}
.who a:hover{color:var(--text)}

/* 상태 탭 (누르면 거르기) */
.tabs{display:flex;align-items:flex-end;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tab{padding:8px 0 7px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-size:12.5px;user-select:none}
.tab b{color:var(--text);font-weight:700;margin-left:5px;font-family:var(--mono);font-size:12px}
.tab.on{color:var(--text);border-color:var(--ci)}
.tab.ok b{color:var(--ok)}.tab.ng b{color:var(--ng)}.tab.keep b{color:var(--keep)}

.main{display:grid;grid-template-columns:300px minmax(0,1fr);align-items:start;max-width:1500px;margin:0 auto}
.side{border-right:1px solid var(--line);position:sticky;top:45px;height:calc(100vh - 45px - 38px);display:flex;flex-direction:column}
.side__head{padding:8px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.side__head input{flex:1;height:28px;padding:0 9px}
.side__head select{width:auto;height:28px;padding:0 6px;font-size:12px}
.list{overflow:auto;flex:1}
.grp{position:sticky;top:0;background:var(--panel);font-size:11px;color:var(--muted);padding:4px 10px;display:flex;justify-content:space-between;border-bottom:1px solid var(--line);z-index:1}
.grp span:last-child{font-family:var(--mono)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) auto 38px;gap:9px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);cursor:pointer}
.row__th{width:64px;height:36px;border-radius:4px;background:#0b0b0d;border:1px solid var(--line);overflow:hidden;display:block}
.row__th img{width:100%;height:100%;object-fit:cover;display:block}
.row__m{display:flex;flex-direction:column;gap:1px;min-width:0}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--ci-bg);box-shadow:inset 2px 0 0 var(--ci)}
.row__t{font-family:var(--mono);font-size:12.5px;font-weight:600}
.row__t.blank{color:var(--keep);font-family:var(--sans);font-weight:400;font-size:12px}
.row__s{font-family:var(--mono);font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row__c{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:inline-flex;align-items:center;gap:3px}
.row__c svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:1.4}
.bd{font-family:var(--en);font-size:10px;font-weight:700;letter-spacing:.06em;text-align:right;color:var(--faint)}
.bd.ok{color:var(--ok)}.bd.ng{color:var(--ng)}.bd.keep{color:var(--keep)}
.empty{padding:18px 12px;color:var(--muted);font-size:12px;line-height:1.7}

.stage{min-width:0;padding:12px 16px 40px}
.player{position:relative;background:#000;border-radius:var(--r);overflow:hidden;aspect-ratio:16/9}
.player video{width:100%;height:100%;display:block;background:#000}
.player__none{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
/* 워터마크: 들어온 사람 이름·소속·시각. 캡처하면 같이 찍힙니다 (클릭은 영상으로 그대로 통과) */
.wm{position:absolute;pointer-events:none;user-select:none;-webkit-user-select:none;font-weight:800;letter-spacing:.04em;
  color:#fff;opacity:var(--wmo,.12);white-space:nowrap;font-size:clamp(13px,2.2vw,22px);text-shadow:0 0 2px rgba(0,0,0,.6);
  transition:left 1.2s ease,top 1.2s ease;z-index:2}
.vg{position:absolute;inset:0;z-index:1;pointer-events:none;object-fit:contain;clip-path:inset(0 0 0 100%)}
.vg.off{display:none}
.wipe{position:absolute;top:0;bottom:0;z-index:2;width:22px;margin-left:-11px;cursor:ew-resize;touch-action:none}
.wipe::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.wipe__h{position:absolute;left:3px;top:50%;width:16px;height:30px;margin-top:-15px;border-radius:8px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.5)}
.ctag{position:absolute;top:8px;left:8px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.06em;padding:3px 7px;border-radius:4px;background:rgba(0,0,0,.55);color:#fff;pointer-events:none}
.ctag.r{left:auto;right:44px;background:var(--ci)}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:8px;padding:18px 10px 8px;
  background:linear-gradient(transparent,rgba(0,0,0,.72));transition:opacity .25s}
.player.idle .ctl,.player.idle .fsb{opacity:0}
.player.idle{cursor:none}
.ctl__b{width:28px;height:28px;flex:none;display:inline-flex;align-items:center;justify-content:center;background:none;border:0;color:#fff;cursor:pointer;padding:0}
.ctl__b svg{width:15px;height:15px;fill:#fff}
.ctl__r{flex:1;min-width:60px;accent-color:var(--ci);height:4px;cursor:pointer}
.ctl__t{font-family:var(--mono);font-size:11px;color:#ddd;white-space:nowrap}
.cmp{display:inline-flex;border:1px solid rgba(255,255,255,.35);border-radius:6px;overflow:hidden;flex:none}
.cmp button{background:rgba(0,0,0,.35);border:0;color:#ddd;font-size:11px;font-weight:600;padding:5px 8px;cursor:pointer}
.cmp button+button{border-left:1px solid rgba(255,255,255,.25)}
.cmp button.on{background:var(--ci);color:#fff}
.gtag{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.05em;color:#fff;background:var(--ci);border-radius:3px;padding:1px 4px;margin-left:6px;vertical-align:1px}
@media (max-width:560px){.ctl__t{display:none}.cmp button{padding:5px 6px}}
.fsb{position:absolute;right:8px;top:8px;z-index:5;width:28px;height:28px;padding:0;justify-content:center;
  background:rgba(0,0,0,.5);border-color:rgba(255,255,255,.15);opacity:.7}
.fsb:hover{opacity:1}
.player:fullscreen,.player:-webkit-full-screen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0}
.player:fullscreen video,.player:-webkit-full-screen video{object-fit:contain}
.player:fullscreen .wm,.player:-webkit-full-screen .wm{font-size:clamp(18px,2.2vw,30px)}
.info{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:9px 0 2px}
.info__clip{font-family:var(--mono);font-size:13.5px;font-weight:600}
.info__tc{font-family:var(--mono);font-size:14px;font-weight:600;color:var(--ci);min-width:96px;text-align:right}
.fstep{margin-left:auto;display:flex;gap:5px}
.info__m{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:100%;margin-bottom:8px}
.mnav{display:none;width:100%;gap:6px}.mnav .btn{flex:1;justify-content:center}
.sct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sct div{border:1px solid var(--line);border-radius:var(--r);background:var(--panel2);padding:4px 8px 2px}
.sct div:focus-within{border-color:var(--ci)}
.sct label{font-family:var(--en);font-size:9.5px;letter-spacing:.12em;color:var(--faint);display:block}
.sct input{border:0;background:transparent;padding:0 0 2px;font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.sct input.sug{color:var(--faint)}
.hint{font-size:11px;color:var(--faint);margin:5px 0 8px;min-height:16px;font-family:var(--mono)}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.big{height:40px;border-radius:var(--r);font-family:var(--en);font-size:13px;font-weight:700;letter-spacing:.1em;background:transparent;border:1px solid}
.big small{font-family:var(--mono);font-size:10px;font-weight:400;opacity:.5;margin-left:6px;letter-spacing:0}
.big.ok{border-color:var(--ok);color:var(--ok)}.big.ng{border-color:var(--ng);color:var(--ng)}.big.keep{border-color:var(--keep);color:var(--keep)}
.big.ok.on{background:var(--ok);color:#0b1f15}.big.ng.on{background:var(--ng);color:#230806}.big.keep.on{background:var(--keep);color:#241805}
.vstat{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);height:40px;border:1px solid var(--line);border-radius:var(--r);padding:0 12px}
.vstat .bd{font-size:12px}
.memo{margin-top:8px}
.memo textarea{min-height:52px;resize:vertical;line-height:1.55}
.save{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:right;margin-top:3px;min-height:15px}

.cms{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cms h3{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.cms h3 span{font-family:var(--mono);color:var(--text);margin-left:4px}
.cm{padding:7px 0;border-bottom:1px solid var(--line)}
.cm:last-of-type{border-bottom:0}
.cm__h{font-size:11.5px;color:var(--muted);display:flex;gap:8px;align-items:center}
.cm__h b{color:var(--text);font-weight:700}
.cm__h .t{font-family:var(--mono);font-size:10.5px}
.cm__h button{margin-left:auto;background:none;border:0;color:var(--faint);font-size:11px;padding:0}
.cm__h button:hover{color:var(--ng)}
.cm__t{white-space:pre-wrap;word-break:break-word;margin-top:2px;font-size:12.5px}
.compose{display:flex;gap:6px;margin-top:8px}
.compose textarea{min-height:34px;height:34px;resize:none;flex:1;padding:7px 9px}
.compose .btn{height:34px}

/* 단축키 (? 버튼) */
.exp{position:relative}
.exp__pop{position:absolute;right:0;top:34px;z-index:40;width:264px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.exp__h{font-size:11px;color:var(--muted);padding:4px 8px 6px}
.exp__pop button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:7px 8px;color:var(--text);cursor:pointer}
.exp__pop button:hover{background:var(--panel2)}
.exp__pop button b{display:block;font-size:12.5px}
.exp__pop button span{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.exp__f{border-top:1px solid var(--line);margin-top:4px;padding:7px 8px 3px;font-size:11px;color:var(--muted);line-height:1.6}
.keys{position:fixed;right:16px;bottom:16px;z-index:30}
.keys__pop{position:absolute;right:0;bottom:36px;width:230px;background:var(--panel);border:1px solid var(--line2);border-radius:var(--r);padding:10px 12px;font-size:11.5px;color:var(--muted);line-height:1.9}
.keys__pop kbd{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line2);border-radius:3px;padding:0 4px;color:var(--text);margin-right:2px}
.keys .btn{width:28px;justify-content:center;padding:0;font-family:var(--en);font-weight:700}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line2);
  padding:8px 14px;border-radius:var(--r);font-size:12px;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}.toast.bad{border-color:var(--ng);color:#ffb3af}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-top:1px solid var(--line);order:2}
  .list{max-height:60vh}
  .stage{order:1;padding:10px 12px 16px}
  .top{padding:8px 12px;flex-wrap:wrap;position:static}
  .top select{max-width:none;flex:1}
  .tabs{padding:0 12px;gap:14px}
  .keys{display:none}
  .mnav{display:flex;margin-bottom:8px}
}
</style>
</head>
<body>

<!-- 들어가기 -->
<div class="gate" id="gate">
  <div class="gate__box">
    <img class="sym" src="mgrm-symbol.svg" alt="맹그라미">
    <h1 id="gTitle">테이크 체크</h1>
    <div class="sub">TAKE CHECK</div>
    <div id="gSub" class="dim" style="font-size:12px"></div>
    <label class="lb" for="gName">이름</label>
    <input id="gName" autocomplete="username" maxlength="40">
    <label class="lb" for="gPw">비밀번호</label>
    <input id="gPw" class="pw" type="password" inputmode="numeric" autocomplete="current-password">
    <label class="chk"><input type="checkbox" id="gRemember"> 이 기기에서 기억</label>
    <button class="btn pri" id="gGo" style="width:100%;height:36px;justify-content:center">들어가기</button>
    <div class="gate__msg" id="gMsg"></div>
    <div class="gate__note">접속·재생 기록이 남고 화면에 이름이 표시됩니다.<br>본인만 사용해 주세요.</div>
  </div>
</div>

<!-- 본 화면 -->
<div id="app" class="hide">
  <div class="top">
    <img class="sym" src="mgrm-symbol.svg" alt="맹그라미">
    <div class="top__t"><b id="tTitle"></b><span>TAKE CHECK</span></div>
    <select id="range" aria-label="회차"></select>
    <span class="who"><i></i><span id="tName"></span><span class="r" id="tRole"></span><a href="#" id="tOut" title="나가기">나가기</a></span>
    <a class="btn hide" id="btnKc" target="_blank" rel="noopener" title="키컷 리뷰 열기">키컷 리뷰</a>
    <button class="btn" id="btnRefresh" title="새로 올린 클립 불러오기"><svg viewBox="0 0 12 12"><path d="M10 6a4 4 0 1 1-1.2-2.85M10 1.5v2.5H7.5"/></svg></button>
    <div class="exp">
      <button class="btn" id="btnCsv" title="편집실로 내보내기"><svg viewBox="0 0 12 12"><path d="M6 1.5v6M3.5 5.5L6 8l2.5-2.5M2 10.5h8"/></svg>내보내기</button>
      <div class="exp__pop hide" id="expPop">
        <div class="exp__h" id="expScope"></div>
        <button data-fmt="resolve"><b>다빈치 리졸브</b><span>메타데이터 CSV · 표시한 클립만</span></button>
        <button data-fmt="ale"><b>프리미어 프로</b><span>ALE · 모든 클립</span></button>
        <button data-fmt="csv"><b>엑셀</b><span>CSV · 정리본 확인용</span></button>
        <div class="exp__f" id="expHelp"></div>
      </div>
    </div>
  </div>
  <div class="tabs" id="stats"></div>

  <div class="main">
    <aside class="side">
      <div class="side__head">
        <input id="q" placeholder="씬·클립 찾기" autocomplete="off">
        <select id="sort" aria-label="정렬">
          <option value="time">촬영순</option>
          <option value="scene">씬순</option>
          <option value="day">회차순</option>
        </select>
      </div>
      <div class="list" id="list"></div>
    </aside>

    <section class="stage">
      <div class="player" id="player">
        <video id="v" playsinline preload="metadata" controlsList="nodownload nofullscreen noremoteplayback" disableRemotePlayback disablePictureInPicture></video>
        <video id="vg" class="vg" muted playsinline preload="metadata" disableRemotePlayback disablePictureInPicture aria-hidden="true"></video>
        <div class="wipe hide" id="wipe"><span class="wipe__h"></span></div>
        <span class="ctag hide" id="tagL">원본</span><span class="ctag r hide" id="tagR">색보정</span>
        <div class="player__none" id="vNone">클립을 고르세요</div>
        <div class="wm" id="wm1"></div><div class="wm" id="wm2"></div>
        <div class="ctl" id="ctl">
          <button class="ctl__b" id="cPlay" title="재생 · 정지 (Space)"></button>
          <input type="range" class="ctl__r" id="cSeek" min="0" max="1000" step="1" value="0" aria-label="재생 위치">

      <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> OK · NG · KEEP<br>

      <kbd>←</kbd><kbd>→</kbd> 2초<br>

      <kbd>F</kbd> 전체 화면<br>

<div class="toast" id="toast"></div>

<script>
'use strict';
const ENDPOINT = '/api/public';
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const P = new URLSearchParams(location.search).get('p') || '';
const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
const SS = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
             set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
const LABEL = { ok: 'OK', ng: 'NG', keep: 'KEEP' };


const S = { pw: '', role: '', name: LS.get('scr:name:' + P) || '', title: '', base: '', days: [], clips: [], marks: {}, comments: [],
  sig: '', sel: '', range: '', sort: 'time', filt: 'all', q: '', dirty: false, sug: false, list: [] };
const view = (() => { try { return JSON.parse(LS.get('scr:view:' + P) || '{}'); } catch { return {}; } })();
if (view.sort) S.sort = view.sort;
const saveView = () => LS.set('scr:view:' + P, JSON.stringify({ sort: S.sort, range: S.range }));

function toast(t, bad) {
  const el = $('toast'); el.textContent = t; el.className = 'toast on' + (bad ? ' bad' : '');
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.className = 'toast'; }, 2200);
}
async function call(action, body) {
  let r;
  try {
    r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ action, p: P, name: S.name, pw: S.pw }, body || {})) });
  } catch { throw new Error('인터넷 연결을 확인해 주세요.'); }
  let j; try { j = await r.json(); } catch { throw new Error('서버 응답을 읽지 못했어요.'); }
  if (j.nas === 'down') throw new Error('NAS에 연결할 수 없어요. 잠시 뒤 다시 해 주세요.');
  return j;
}
const ERR = { none: '없는 링크예요. 링크를 다시 확인해 주세요.', off: '지금은 닫혀 있는 페이지예요.',
  expired: '기간이 끝난 페이지예요.', pw: '이름 또는 비밀번호가 맞지 않아요. 안내받은 그대로 적어 주세요.' };
const errText = (j) => j.error === 'locked' ? `비밀번호를 여러 번 틀려서 ${j.min}분 동안 잠겼어요.` : (ERR[j.error] || j.error || '문제가 생겼어요.');

/* ───────── 들어가기 */
(async function boot() {
  if (!P) { $('gSub').textContent = '링크에 페이지 정보가 없어요.'; $('gGo').disabled = true; return; }
  $('gName').value = S.name;
  try {
    const m = await call('scripter.meta');
    if (!m.ok) { $('gSub').textContent = errText(m); $('gGo').disabled = true; return; }
    $('gTitle').textContent = m.title || '테이크 체크';
    document.title = (m.title ? m.title + ' · ' : '') + '테이크 체크';
    if (m.admin) { S.name = ''; S.pw = ''; if (await open(true)) return; S.name = LS.get('scr:name:' + P) || ''; }
  } catch (e) { $('gSub').textContent = e.message; }
  const saved = S.name && (SS.get('scr:pw:' + P) || LS.get('scr:pw:' + P));
  if (saved && S.name) { S.pw = saved; if (await open(true)) return; }
  (S.name ? $('gPw') : $('gName')).focus();
})();
$('gGo').onclick = () => go();
$('gPw').onkeydown = (e) => { if (e.key === 'Enter') go(); };
$('gName').onkeydown = (e) => { if (e.key === 'Enter') $('gPw').focus(); };
async function go() {
  const name = $('gName').value.trim(), pw = $('gPw').value.trim();
  if (!name) { $('gMsg').textContent = '이름을 적어 주세요.'; $('gName').focus(); return; }
  if (!pw) { $('gMsg').textContent = '비밀번호를 적어 주세요.'; $('gPw').focus(); return; }
  S.name = name; S.pw = pw;
  $('gGo').disabled = true; $('gMsg').textContent = '';
  const ok = await open(false);
  $('gGo').disabled = false;
  if (ok) {
    SS.set('scr:pw:' + P, pw);
    if ($('gRemember').checked) LS.set('scr:pw:' + P, pw); else LS.del('scr:pw:' + P);
  }
}
async function open(silent, fresh) {
  let j;
  try { j = await call('scripter.open', { fresh: !!fresh }); }
  catch (e) { if (!silent) $('gMsg').textContent = e.message; return false; }
  if (!j.ok) { if (!silent) $('gMsg').textContent = errText(j); return false; }
  S.name = j.me || S.name; S.org = j.org || ''; if (!j.admin) LS.set('scr:name:' + P, S.name);
  apply(j, true);
  startWm();
  $('gate').classList.add('hide'); $('app').classList.remove('hide');
  startPoll();
  return true;
}

/* ───────── 받은 자료 정리 */
const keyOf = (c) => c.d + '/' + c.id;
function apply(j, full) {
  if (j.me) { S.name = j.me; S.org = j.org || ''; }
  // 키컷: 허브 관리자는 [키컷으로], 명단에서 키컷 권한이 있으면 [키컷 리뷰] 단추
  if (j.kc) { S.admin = !!j.admin; S.kc = new Set(j.kc); S.kcRole = j.kcRole || '';
    $('btnKc').href = 'keycut.html?p=' + encodeURIComponent(P); $('btnKc').classList.toggle('hide', !S.kcRole); }
  if (j.clips) {
    S.role = j.role; S.title = j.title; S.base = j.base; S.days = j.days; S.clips = j.clips; S.sig = j.sig;
    const byD = {}; S.days.forEach((d, i) => { d.i = i; byD[d.d] = d; }); S.dayBy = byD;
  }
  const cur = S.sel, keepCur = S.dirty;
  const old = S.marks[cur];
  S.marks = {}; (j.marks || []).forEach((m) => { S.marks[m.d + '/' + m.id] = m; });
  if (keepCur && old) S.marks[cur] = old;           // 지금 고치는 클립은 내 입력을 지킵니다
  S.comments = j.comments || [];
  if (full) renderTop();
  renderStats(); renderList();
  if (full && j.clips) {
    if (!S.sel || !S.clips.some((c) => keyOf(c) === S.sel)) { const f = S.list[0]; if (f) select(keyOf(f.c), true); else renderStage(); }
    else renderStage(true);
  } else renderStage(true);
}
function renderTop() {
  $('tTitle').textContent = S.title || '테이크 체크';
  document.title = (S.title ? S.title + ' · ' : '') + '테이크 체크';
  const scr = S.role === 'scripter';
  $('tRole').textContent = scr ? '스크립터' : '보기';
  $('tName').textContent = S.name;
  $('acts').classList.toggle('hide', !scr); $('vstat').classList.toggle('hide', scr);
  ['fS', 'fC', 'fT', 'fMemo'].forEach((id) => { $(id).disabled = !scr; });
  // 회차
  const withClips = S.days.filter((d) => d.count > 0);
  if (!S.range) {
    const want = view.range;
    S.range = want === 'all' || withClips.some((d) => d.d === want) ? want : (withClips.length ? withClips[withClips.length - 1].d : 'all');
  }
  if (S.range !== 'all' && !withClips.some((d) => d.d === S.range)) S.range = 'all';
  $('range').innerHTML = `<option value="all">전체 회차 (${S.clips.length})</option>` +
    withClips.map((d) => `<option value="${esc(d.d)}">${esc(d.label)} (${d.count})</option>`).join('');
  $('range').value = S.range;
  $('sort').value = S.sort;
}

/* ───────── 목록 */
const markOf = (c) => (c && S.marks[keyOf(c)]) || {};
const blank = (m) => !m.s || !m.c || !m.t;
const nOf = (v) => { const n = parseFloat(v); return isNaN(n) ? Infinity : n; };
function dayIdx(c) { const d = S.dayBy[c.d]; if (!d) return 9999; return d.no ? Number(d.no) : 5000 + d.i; }
function timeCmp(a, b) {
  const da = dayIdx(a), db = dayIdx(b);
  if (da !== db) return da - db;
  if (a.tcs != null && b.tcs != null && a.tcs !== b.tcs) return a.tcs - b.tcs;
  return a.id < b.id ? -1 : a.id > b.id ? 1 : 0;
}
function cmCount(c) { return S.comments.filter((x) => x.d === c.d && x.clip === c.id).length; }
function inRange(c) { return S.range === 'all' || c.d === S.range; }
function computeList() {
  const q = S.q.trim().toLowerCase().replace(/^s#?/, 's#');
  let arr = S.clips.filter(inRange).map((c) => ({ c, m: markOf(c) }));
  if (S.filt === 'blank') arr = arr.filter((x) => blank(x.m));
  else if (S.filt === 'none') arr = arr.filter((x) => !x.m.st);
  else if (S.filt === 'cm') arr = arr.filter((x) => cmCount(x.c) > 0);
  else if (S.filt === 'gr') arr = arr.filter((x) => x.c.gr);
  else if (S.filt !== 'all') arr = arr.filter((x) => x.m.st === S.filt);
  if (q) arr = arr.filter((x) => {
    const hay = `${x.c.id} ${x.c.cam}캠 s#${x.m.s || ''} c${x.m.c || ''} t${x.m.t || ''} ${x.m.memo || ''}`.toLowerCase();
    return /^\d+$/.test(q) ? String(x.m.s || '') === q || x.c.id.toLowerCase().includes(q) : hay.includes(q);
  });
  if (S.sort === 'scene') arr.sort((a, b) => (nOf(a.m.s) - nOf(b.m.s)) || String(a.m.s || '').localeCompare(String(b.m.s || '')) ||
    (nOf(a.m.c) - nOf(b.m.c)) || (nOf(a.m.t) - nOf(b.m.t)) || (a.c.cam < b.c.cam ? -1 : a.c.cam > b.c.cam ? 1 : 0) || timeCmp(a.c, b.c));
  else if (S.sort === 'day') arr.sort((a, b) => (dayIdx(b.c) - dayIdx(a.c)) || timeCmp(a.c, b.c));
  else arr.sort((a, b) => timeCmp(a.c, b.c));
  return arr;
}
function groupOf(x) {
  if (S.sort === 'scene') return x.m.s ? 'S#' + x.m.s : '씬 미입력';
  if (S.sort === 'day' || S.range === 'all') { const d = S.dayBy[x.c.d]; return d ? d.label : x.c.d; }
  return '';
}
function renderList() {
  S.list = computeList();
  const L = $('list');
  if (!S.clips.length) { L.innerHTML = '<div class="empty">올라온 클립 없음</div>'; return; }
  if (!S.list.length) { L.innerHTML = '<div class="empty">해당 클립 없음</div>'; return; }
  const counts = {}; S.list.forEach((x) => { const g = groupOf(x); counts[g] = (counts[g] || 0) + 1; });
  let last = null, html = '';
  S.list.forEach((x) => {
    const g = groupOf(x);
    if (g && g !== last) { html += `<div class="grp"><span>${esc(g)}</span><span>${counts[g]}</span></div>`; last = g; }
    const m = x.m, c = x.c, k = keyOf(c), n = cmCount(c);
    const t = blank(m) ? '<span class="row__t blank">미입력</span>' : `<span class="row__t">${esc(m.s)}-${esc(m.c)}-${esc(m.t)}</span>`;
    const d = S.dayBy[c.d];
    const sub = S.sort === 'scene' ? `${c.id} · ${d ? (d.no ? d.no + '회' : d.d) : ''}` : `${c.id}${c.tc ? ' · ' + c.tc.slice(0, 8) : ''}`;
    // 썸네일: NAS 가 회차 폴더/_thumbs/<클립>.jpg 로 만들어 둠 (아직이면 빈 칸)
    const stem = c.f.split('/').pop().replace(/\.[^.]+$/, '');
    const th = c.th ? `<img loading="lazy" decoding="async" alt="" src="${esc(S.base + encodeURIComponent(c.d) + '/_thumbs/' + encodeURIComponent(stem) + '.jpg?v=' + (c.at || ''))}" onerror="this.remove()">` : '';
    html += `<div class="row${k === S.sel ? ' sel' : ''}" data-k="${esc(k)}"><span class="row__th">${th}</span><span class="row__m"><span>${t}${c.gr ? '<span class="gtag">COLOR</span>' : ''}</span><span class="row__s">${esc(sub)}</span></span>` +
      (n ? `<span class="row__c" title="코멘트 ${n}"><svg viewBox="0 0 12 12"><path d="M2 2.5h8v5.5H5L3 10V8H2z"/></svg>${n}</span>` : '<span></span>') +
      `<span class="bd ${m.st || 'none'}">${LABEL[m.st] || '—'}</span></div>`;
  });
  L.innerHTML = html;
}
// 휴대폰(목록이 아래)에서는 클립을 누르면 재생 화면으로 올라감
const narrow = () => matchMedia('(max-width:900px)').matches;
$('list').onclick = async (e) => {
  const r = e.target.closest('.row'); if (!r) return;
  await select(r.dataset.k, narrow());
  if (narrow()) $('player').scrollIntoView({ behavior: 'smooth', block: 'start' });
};
function renderStats() {
  const arr = S.clips.filter(inRange).map(markOf);
  const n = (f) => arr.filter(f).length;
  const cmN = S.clips.filter(inRange).filter((c) => cmCount(c) > 0).length;
  const items = [['all', '전체', arr.length, ''], ['ok', 'OK', n((m) => m.st === 'ok'), 'ok'], ['ng', 'NG', n((m) => m.st === 'ng'), 'ng'],
    ['keep', 'KEEP', n((m) => m.st === 'keep'), 'keep'], ['none', '미확인', n((m) => !m.st), ''], ['blank', '씬 미입력', n(blank), ''], ['cm', '코멘트', cmN, '']];
  const grN = S.clips.filter(inRange).filter((c) => c.gr).length;
  if (grN || S.filt === 'gr') items.push(['gr', '색보정', grN, '']);
  $('stats').innerHTML = items.map(([f, l, v, cl]) => `<span class="tab ${cl}${S.filt === f ? ' on' : ''}" data-f="${f}">${l}<b>${v}</b></span>`).join('');
}
$('stats').onclick = (e) => { const s = e.target.closest('.tab'); if (s) setFilt(s.dataset.f); };
function setFilt(f) {
  S.filt = f;
  renderStats(); renderList();
}
$('q').oninput = (e) => { S.q = e.target.value; renderList(); };
$('sort').onchange = (e) => {
  S.sort = e.target.value;
  if (S.sort === 'scene' && S.range !== 'all') { S.range = 'all'; $('range').value = 'all'; toast('씬별 보기는 여러 회차를 같이 봐서 전체 회차로 바꿨어요.'); renderStats(); }
  saveView(); renderList();
};
$('range').onchange = (e) => { S.range = e.target.value; saveView(); renderStats(); renderList(); };

/* ───────── 클립 보기 */
const clipBy = (k) => S.clips.find((c) => keyOf(c) === k);
async function select(k, quiet) {
  if (S.dirty) await flush();
  S.sel = k; S.sug = false;
  document.querySelectorAll('#list .row').forEach((r) => r.classList.toggle('sel', r.dataset.k === k));
  const el = document.querySelector(`#list .row[data-k="${CSS.escape(k)}"]`);
  if (el && !quiet) el.scrollIntoView({ block: 'nearest' });
  const c = clipBy(k);
  const v = $('v');
  if (c) {
    v.src = S.base + encodeURIComponent(c.d) + '/' + c.f.split('/').map(encodeURIComponent).join('/');
    $('vNone').classList.add('hide');
  } else { v.removeAttribute('src'); v.load(); $('vNone').classList.remove('hide'); }
  loadGrade(c);
  renderStage();
}
function suggest(c) {
  // 촬영 순서로 바로 앞 클립(같은 회차, 씬이 적힌 것)을 보고 채웁니다
  const same = S.clips.filter((x) => x.d === c.d).sort(timeCmp);
  const i = same.findIndex((x) => keyOf(x) === keyOf(c));
  for (let j = i - 1; j >= 0; j--) {
    const p = same[j], m = markOf(p);
    if (blank(m)) continue;
    const together = p.tcs != null && c.tcs != null && Math.abs(c.tcs - p.tcs) <= 3 && p.cam && c.cam && p.cam !== c.cam;
    if (together) return { s: m.s, c: m.c, t: m.t, why: `${p.id}와 같은 시각 · 같은 테이크` };
    const tn = parseInt(m.t, 10);
    return { s: m.s, c: m.c, t: isNaN(tn) ? '' : String(tn + 1), why: `${p.id} 다음 테이크` };
  }
  return null;
}
const fmtDur = (s) => { s = Math.round(s || 0); return s >= 60 ? `${Math.floor(s / 60)}분 ${s % 60}초` : `${s}초`; };
function renderStage(soft) {
  const c = clipBy(S.sel);
  const m = c ? markOf(c) : {};
  $('iClip').textContent = c ? c.id : '—';
  const inKc = c && S.kc && S.kc.has(c.d + '|' + c.id);
  $('bKcAdd').classList.toggle('hide', !(S.admin && c)); $('bKcAdd').classList.toggle('on', !!inKc);

/* ───────── 표시·저장 (스크립터) */

/* ───────── 색보정 비교 (1.12.0)

document.addEventListener('keydown', (e) => {

  else if ((e.key === 'w' || e.key === 'W') && G.on) { e.preventDefault(); setCmp(S.cmp === 'w' ? 'g' : 'w'); }
  else if (e.key === ',' || e.key === '<') { e.preventDefault(); frameStep(-1); }
  else if (e.key === '.' || e.key === '>') { e.preventDefault(); frameStep(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); v.currentTime = Math.max(0, v.currentTime + (e.key === 'ArrowLeft' ? -2 : 2)); }
});

/* ───────── 머리 버튼 */
$('btnRefresh').onclick = async () => {
  $('btnRefresh').disabled = true;
  try { if (S.dirty) await flush(); const j = await call('scripter.open', { fresh: true }); if (!j.ok) throw new Error(errText(j)); apply(j, true); toast('최신 목록으로 불러왔어요.'); }
  catch (e) { toast(e.message, true); }
  finally { $('btnRefresh').disabled = false; }
};
const EXP_HELP = {
  resolve: '리졸브: 미디어 풀에서 클립 선택 → 파일 › 메타데이터 가져오기 › 선택한 클립. <b>파일 확장자 무시</b>는 켜고, <b>시작·끝 타임코드로 맞추기</b>는 끄세요.',
  ale: '프리미어: 파일 › 가져오기로 .ale 열기 → 생긴 오프라인 클립을 모두 선택 → 미디어 연결로 영상 폴더 지정.',
  csv: '엑셀에서 바로 열려요. 편집실에 정리본으로 보낼 때 쓰세요.',
};
$('btnCsv').onclick = (e) => {
  e.stopPropagation();
  const day = S.range === 'all' ? null : (S.days || []).find((d) => d.d === S.range);
  $('expScope').textContent = '범위: ' + (day ? (day.label || (day.no ? day.no + '회차' : day.d)) : '전체 회차') + '  (위 회차 선택을 따라가요)';
  $('expHelp').innerHTML = EXP_HELP.resolve;
  $('expPop').classList.toggle('hide');
};
document.querySelectorAll('#expPop button').forEach((b) => {
  b.onmouseenter = () => { $('expHelp').innerHTML = EXP_HELP[b.dataset.fmt]; };
  b.onclick = async () => {
    $('expPop').classList.add('hide');
    try {
      if (S.dirty) await flush();
      const j = await call('scripter.csv', { d: S.range === 'all' ? '' : S.range, fmt: b.dataset.fmt });
      if (!j.ok) throw new Error(errText(j));
      if (b.dataset.fmt === 'resolve' && !j.marked) return toast('아직 표시한 클립이 없어서 내보낼 게 없어요.', true);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([j.csv], { type: j.mime || 'text/csv;charset=utf-8' }));
      a.download = j.name; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
      toast(b.dataset.fmt === 'resolve' ? `클립 ${j.marked}개를 내보냈어요.` : `클립 ${j.rows}개를 내보냈어요.`);
    } catch (e) { toast(e.message, true); }
  };
});
document.addEventListener('click', (e) => { if (!e.target.closest('.exp')) $('expPop').classList.add('hide'); });
$('tOut').onclick = async (e) => {
  e.preventDefault();
  if (S.dirty) await flush();
  try { sessionStorage.removeItem('scr:pw:' + P); } catch {}
  LS.del('scr:pw:' + P);
  location.reload();
};

/* ───────── 10초마다 다른 사람이 표시한 내용 가져오기 */
let pollT = 0, polling = false;
function startPoll() { clearInterval(pollT); pollT = setInterval(poll, 10000); }
async function poll() {
  if (document.hidden || polling) return;
  polling = true;
  try {
    const j = await call('scripter.sync', { sig: S.sig });
    if (j.ok) apply(j, !!j.clips);
    else if (j.error === 'pw' || j.error === 'off' || j.error === 'expired') { clearInterval(pollT); toast(errText(j) + ' 다시 들어와 주세요.', true); }
  } catch {} finally { polling = false; }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && S.role) poll(); });
window.addEventListener('beforeunload', (e) => { if (S.dirty) { flush(); e.preventDefault(); e.returnValue = ''; } });
</script>
