<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>로그인 · 맹그라미 업무 허브</title>
<link rel="stylesheet" href="wct-style.css">
</head>
<body>
<div class="center">
  <h1 style="margin-bottom:8px">맹그라미 업무 허브</h1>
  <p class="dim">NAS(QNAP) 계정으로 로그인합니다.</p>
  <form id="f" style="margin-top:22px;text-align:left">
    <label>아이디</label>
    <input type="text" id="uid" autocomplete="username" autocapitalize="off" spellcheck="false" autofocus>
    <label>비밀번호</label>
    <input type="password" id="pw" autocomplete="current-password">
    <button class="b" id="go" style="width:100%;margin-top:14px">로그인</button>
    <div class="msg hide" id="msg"></div>
    <p class="dim" style="font-size:12px;margin-top:18px;line-height:1.7">
      계정이 없거나 비밀번호를 잊으셨으면 관리자에게 말씀해 주세요.<br>
      (계정은 NAS 제어판에서 관리합니다)</p>
  </form>
</div>
<script>
const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('go'), msg = $('msg');
  msg.className = 'msg hide';
  const user = $('uid').value.trim(), pw = $('pw').value;
  if (!user || !pw) { msg.className = 'msg bad'; msg.textContent = '아이디와 비밀번호를 입력하세요.'; return; }
  btn.disabled = true; btn.textContent = '확인 중…';
  try {
    const r = await fetch('/api/login', { method: 'POST', credentials: 'same-origin',
      headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user, pw }) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || '로그인에 실패했습니다.');
    sessionStorage.removeItem('wct'); sessionStorage.removeItem('wct_data');
    const next = new URLSearchParams(location.search).get('next');
    location.href = (next && /^[a-z0-9_-]+\.html$/i.test(next)) ? next : 'admin.html';
  } catch (err) {
    msg.className = 'msg bad'; msg.textContent = err.message;
    btn.disabled = false; btn.textContent = '로그인';
  }
});
</script>
</body>
</html>
