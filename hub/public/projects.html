<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>프로젝트 · 맹그라미</title>
<link rel="stylesheet" href="wct-style.css">
<style>
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
  @media(max-width:980px){.board{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.board{grid-template-columns:1fr}}

  .col{background:var(--soft);border:1px solid var(--line);border-radius:13px;padding:12px;
    min-height:180px;transition:border-color .15s,background .15s}
  .col.over{border-color:var(--accent);background:var(--tint)}
  .col .ch{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 4px}
  .col .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .col .cn{font-weight:700;font-size:13.5px;flex:1}
  .col .cc{color:var(--dim);font-size:12px}

  .pc{background:var(--card);border:1px solid var(--line);border-radius:11px;
    padding:13px;margin-bottom:9px;cursor:grab;transition:border-color .15s,transform .1s}
  .pc:hover{border-color:var(--accent)}
  .pc:active{cursor:grabbing}
  .pc.drag{opacity:.4}
  .pc .nm{font-weight:700;font-size:14px;margin-bottom:3px;word-break:break-all}
  .pc .cl{color:var(--dim);font-size:11.5px}
  .pc .mt{display:flex;gap:6px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .pc .amt{font-size:11.5px;color:var(--dim);margin-top:6px}

  .prog{height:5px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
  .prog.full i{background:var(--ok)}

  .chip{padding:2px 8px;border-radius:20px;font-size:10.5px;border:1px solid var(--line);
    color:var(--dim)}
  .chip.due{color:var(--warn);border-color:var(--warn)}
  .chip.over{color:var(--bad);border-color:var(--bad)}
  .chip.ok{color:var(--ok);border-color:var(--ok)}

  .task{display:flex;align-items:flex-start;gap:9px;padding:8px 0;
    border-bottom:1px solid var(--line)}
  .task:last-child{border-bottom:0}
  .task input[type=checkbox]{width:17px;height:17px;flex:none;margin-top:2px;
    accent-color:var(--accent);cursor:pointer}
  .task .tx{flex:1;font-size:13px;line-height:1.5}
  .task.on .tx{color:var(--dim);text-decoration:line-through}
  .task .x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:15px;padding:0 4px}
  .tmeta{display:flex;gap:8px;align-items:center;margin-top:5px;flex-wrap:wrap}
  .tdue{width:132px;padding:4px 7px;font-size:11.5px;background:var(--soft)}
  .tcal{display:flex;align-items:center;gap:4px;margin:0;padding:4px 8px;
    border:1px solid var(--line);border-radius:16px;cursor:pointer;
    font-size:10.5px;color:var(--dim);white-space:nowrap}
  .tcal input{width:13px;height:13px;margin:0;accent-color:var(--accent)}
  .tcal.on{border-color:var(--ci-b);color:var(--ci-c);background:var(--tint);font-weight:700}
  .task.on .tmeta{opacity:.45}
  .tsel{width:auto;padding:3px 6px;font-size:11px;background:var(--soft)}
  .tstart{width:120px;padding:4px 7px;font-size:11px;background:var(--soft)}
  .fbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;
    border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:12.5px}
  .fbox code{font-size:12px;word-break:break-all}
  .codechip{font-weight:700;color:var(--ci-c);border-color:var(--ci-b)}
  .task .x:hover{color:var(--bad)}

  .stagehd{display:flex;align-items:center;gap:8px;margin:18px 0 6px;font-size:12.5px;
    color:var(--accent);font-weight:700}
  .stagehd .ln{flex:1;height:1px;background:var(--line)}
  .kpi{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px}
  .kpi div span{display:block;color:var(--dim);font-size:11.5px}
  .kpi div b{font-size:19px}
</style>
</head>
<body>
<div class="wrap">

  <div class="kpi" id="kpi"></div>

  <div class="bar">
    <button class="b" id="newBtn">＋ 새 프로젝트</button>
    <input id="q" placeholder="프로젝트·클라이언트 검색" style="max-width:240px">
    <label style="margin:0;display:flex;align-items:center;gap:7px;color:var(--fg);font-size:13px">
      <input type="checkbox" id="showDone" style="width:auto"> 완료 포함
    </label>
    <span style="flex:1"></span>
    <span class="dim" style="font-size:12px">카드를 끌어서 단계를 옮길 수 있습니다</span>
  </div>

  <div class="board" id="board"></div>
</div>

<!-- 프로젝트 상세 -->
<dialog id="dlg">
  <div style="display:flex;align-items:flex-start;gap:12px">
    <div style="flex:1">
      <h2 id="dTitle" style="margin-bottom:4px">프로젝트</h2>
      <div class="dim" id="dSub" style="font-size:12.5px"></div>
    </div>
    <button class="g sm" onclick="$('dlg').close()">닫기</button>
  </div>

  <div class="row r3" style="margin-top:16px">
    <div><label>단계</label><select id="dStage"></select></div>
    <div><label>마감일</label><input type="date" id="dDue"></div>
    <div><label>계약금액</label><input id="dAmount" inputmode="numeric"></div>
  </div>
  <div class="row r3">
    <div><label>코드</label><input id="dCode" maxlength="6" placeholder="예: KSP" style="text-transform:uppercase"></div>
    <div><label>클라이언트</label><input id="dClient"></div>
    <div><label>담당</label><input id="dOwner"></div>
  </div>
  <div class="fbox" id="dFolder"></div>
  <label>메모</label>
  <textarea id="dMemo" style="min-height:70px"></textarea>

  <div id="dCost" class="note" style="margin-top:14px"></div>

  <div id="dTasks"></div>

  <div class="dim" style="font-size:11.5px;margin-top:10px">
    📅 를 켜고 마감일을 정하면 작업 종류에 맞는 MGRM 캘린더(촬영·구성·편집·D.I·스케줄)에 들어갑니다.
    여러 날에 걸친 일은 <b>시작일</b>도 적으면 구간으로 들어가요. 본 촬영·납품처럼 꼭 챙길 것만 켜세요.
  </div>

  <div class="bar" style="margin-top:12px">
    <input id="newTask" placeholder="작업 추가 후 Enter" style="flex:1;min-width:180px">
    <select id="newTaskStage" style="width:120px"></select>
  </div>

  <div class="bar" style="margin-top:6px">
    <button class="b" id="dSave">저장</button>
    <span style="flex:1"></span>
    <button class="g" id="dDelete">프로젝트 삭제</button>
  </div>
  <div class="msg hide" id="dMsg"></div>
</dialog>

<!-- 새 프로젝트 -->
<dialog id="newDlg">
  <h2>새 프로젝트</h2>
  <div class="row r2">
    <div><label>프로젝트명 *</label><input id="nName" placeholder="예: 이안 더 써밋 동래"></div>
    <div><label>클라이언트</label><input id="nClient"></div>
  </div>
  <div class="row r3">
    <div><label>코드 (영문 3글자)</label><input id="nCode" maxlength="6" placeholder="예: KSP" style="text-transform:uppercase"></div>
    <div style="grid-column:span 2"><label>&nbsp;</label>
      <div class="dim" style="font-size:11.5px;padding-top:6px">폴더 이름과 캘린더 제목 [코드]에 함께 씁니다</div></div>
  </div>
  <div class="row r3">
    <div><label>시작일</label><input type="date" id="nStart"></div>
    <div><label>마감일</label><input type="date" id="nDue"></div>
    <div><label>계약금액</label><input id="nAmount" inputmode="numeric" placeholder="0"></div>
  </div>
  <div class="fbox" style="display:block">
    <label style="display:flex;align-items:center;gap:8px;color:var(--fg);margin:0">
      <input type="checkbox" id="nMakeFolder" checked style="width:auto">
      NAS 의뢰 폴더 만들기 <span class="dim" style="font-size:11.5px">(1. 의뢰 / 올해 / 새 폴더규칙 템플릿)</span>
    </label>
    <div id="nFolderOpt" style="margin-top:8px">
      <label style="margin-top:0">폴더 이름</label>
      <input id="nFolderName" placeholder="11_KSP_사업명">
      <label style="display:flex;align-items:center;gap:8px;color:var(--fg);margin-top:8px">
        <input type="checkbox" id="nColorOnly" style="width:auto"> 색보정 단독 의뢰
        <span class="dim" style="font-size:11.5px">(00_ADMIN · 20_IN · 30_WORK · 40_OUT 만)</span>
      </label>
    </div>
  </div>
  <label style="display:flex;align-items:center;gap:8px;color:var(--fg);margin-top:14px">
    <input type="checkbox" id="nTemplate" checked style="width:auto">
    단계별 기본 작업 자동 생성
  </label>
  <div class="note" style="margin-top:8px" id="nTplPreview"></div>
  <div class="bar" style="margin-top:14px">
    <button class="b" id="nSave">만들기</button>
    <button class="g" onclick="$('newDlg').close()">취소</button>
  </div>
  <div class="msg hide" id="nMsg"></div>
</dialog>

<!-- 기존 폴더 연결 -->
<dialog id="linkDlg">
  <h2>기존 의뢰 폴더 연결</h2>
  <div class="row r3">
    <div><label>연도</label><select id="lYear"></select></div>
    <div style="grid-column:span 2"><label>폴더</label><select id="lFolder"></select></div>
  </div>
  <div class="bar" style="margin-top:14px">
    <button class="b" id="lSave">연결</button>
    <button class="g" onclick="$('linkDlg').close()">취소</button>
  </div>
  <div class="msg hide" id="lMsg"></div>
</dialog>

<script src="wct-core.js"></script>
<script>
const STAGES = [
  { key: '프리',    color: '#482583', desc: '기획 · 준비' },
  { key: '프로덕션', color: '#E84278', desc: '촬영' },
  { key: '포스트',   color: '#A63285', desc: '편집 · DI · 납품 준비' },
  { key: '완료',    color: '#2E8B57', desc: '납품 완료' },
];

/* 영상 제작 실무 기준 기본 작업
   ★ 표시한 것은 캘린더에 넣도록 미리 켜둡니다.
     날짜가 정해지는 굵직한 일정만 골랐습니다.
     나머지는 필요할 때 개별로 켜면 됩니다. */
const TEMPLATE = {
  '프리': [
    '기획 · 시나리오', '콘티 · 스토리보드', '견적 · 계약', '로케이션 헌팅',
    '캐스팅', '스태프 섭외', '★촬영 스케줄 확정', '장비 리스트 · 렌탈',
  ],
  '프로덕션': [
    '장비 점검', '★촬영 D-1 준비', '★본 촬영', 'DIT 백업 · 검수', '데이터 인계',
  ],
  '포스트': [
    '가편집', '★1차 시사', '수정 반영', 'DI · 색보정', '사운드 믹싱',
    'CG · 그래픽', '★최종 시사', '마스터 출력', '★납품',
  ],
};

/** '★' 접두사를 떼고 캘린더 표시 여부를 가려냅니다 */
function parseTask(title) {
  return title.startsWith('★')
    ? { title: title.slice(1), cal: true }
    : { title, cal: false };
}

let CUR = null;

/* 캘린더 고르기 — NAS 서버와 같은 규칙 (작업 이름으로 자동) */
const CALS = ['MGRM촬영', 'MGRM구성', 'MGRM편집', 'MGRM D.I', 'MGRM스케줄'];
function guessCal(t) {
  t = String(t || '');
  if (/DIT/i.test(t)) return 'MGRM촬영';
  if (/D\.?I(?![A-Za-z])|색보정|컬러|그레이딩/i.test(t)) return 'MGRM D.I';
  if (/편집|시사|사운드|믹싱|CG|그래픽|마스터|자막/i.test(t)) return 'MGRM편집';
  if (/기획|시나리오|콘티|구성|스토리보드|대본|트리트먼트/.test(t)) return 'MGRM구성';
  if (/촬영|헌팅|로케이션|답사/.test(t)) return 'MGRM촬영';
  return 'MGRM스케줄';
}
const normCode = (v) => String(v || '').trim().toUpperCase();
const safeName = (v) => String(v || '').replace(/[\\/:*?"<>|]/g, '').replace(/\s+/g, '');
function folderNameOf(code, name) {
  const mm = new Date(Date.now() + 9 * 3600e3).toISOString().slice(5, 7);
  return [mm, safeName(code), safeName(name)].filter(Boolean).join('_');
}
/** 같은 코드를 쓰는 다른 프로젝트 */
function codeTaken(code, exceptId) {
  if (!code) return null;
  return (WCT.data.projects || []).find((p) => p.id !== exceptId && normCode(p.code) === code) || null;
}

(async function init() {
  if (!await WCT.requireAuth()) return;
  window.__onReload = render;
  mountHeader('프로젝트');
  if (!WCT.isAdmin()) {
    document.querySelectorAll('.adminOnlyField').forEach((el) => (el.style.display = 'none'));
  }

  STAGES.forEach((s) => {
    $('dStage').innerHTML += `<option value="${s.key}">${s.key}</option>`;
    if (s.key !== '완료') $('newTaskStage').innerHTML += `<option value="${s.key}">${s.key}</option>`;
  });

  $('nTplPreview').innerHTML = Object.entries(TEMPLATE)
    .map(([k, v]) => `<b>${k}</b> ${v.length}개 — ` +
      esc(v.slice(0, 3).map((t) => parseTask(t).title).join(', ')) + ' …').join('<br>') +
    '<br><br>📅 표시가 붙는 작업: ' +
    esc(Object.values(TEMPLATE).flat().filter((t) => t.startsWith('★'))
      .map((t) => t.slice(1)).join(', ')) +
    '<br><span style="font-size:11px">마감일을 정하면 캘린더에 들어갑니다. 언제든 끄고 켤 수 있습니다.</span>';

  $('q').addEventListener('input', render);
  $('showDone').addEventListener('change', render);
  $('newBtn').onclick = () => {
    $('nStart').value = today();
    $('nMsg').className = 'msg hide';
    $('nFolderName').dataset.edited = '';
    $('nFolderName').value = folderNameOf(normCode($('nCode').value), $('nName').value);
    $('newDlg').showModal();
  };
  const autoFolder = () => {
    if (!$('nFolderName').dataset.edited)
      $('nFolderName').value = folderNameOf(normCode($('nCode').value), $('nName').value);
  };
  $('nName').addEventListener('input', autoFolder);
  $('nCode').addEventListener('input', autoFolder);
  $('nFolderName').addEventListener('input', () => { $('nFolderName').dataset.edited = '1'; });
  $('nMakeFolder').addEventListener('change', () => {
    $('nFolderOpt').style.display = $('nMakeFolder').checked ? '' : 'none';
  });
  $('lYear').addEventListener('change', () => loadFolders($('lYear').value));
  $('newTask').addEventListener('keydown', (e) => { if (e.key === 'Enter') addTask(); });

  await WCT.loadThenRefresh(render);
})();

const tasksOf = (pid) => (WCT.data.tasks || []).filter((t) => t.projectId === pid);

function progress(pid) {
  const t = tasksOf(pid);
  return { total: t.length, done: t.filter((x) => x.done).length,
           pct: t.length ? Math.round(t.filter((x) => x.done).length / t.length * 100) : 0 };
}

/** 프로젝트에 물린 인건비 — 원천징수 지급 기록에서 끌어온다 */
function laborOf(name) {
  const list = (WCT.data.payments || []).filter((p) => p.project === name);
  return { count: list.length, gross: list.reduce((a, p) => a + p.gross, 0) };
}

/** 세금계산서에서 끌어온 매출·매입 (공급가액 기준) */
function moneyOf(name) {
  const s = (WCT.data.sales || []).filter((x) => x.project === name);
  const p = (WCT.data.purchases || []).filter((x) => x.project === name);
  return { salesCount: s.length, sales: s.reduce((a, x) => a + x.supply, 0),
           purCount: p.length, purchases: p.reduce((a, x) => a + x.supply, 0) };
}

function dueChip(due) {
  if (!due) return '';
  const d = dday(new Date(due + 'T00:00:00'));
  const cls = d.left < 0 ? 'over' : d.left <= 7 ? 'due' : '';
  return `<span class="chip ${cls}">${esc(due.slice(5))} · ${d.text}</span>`;
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  let list = (WCT.data.projects || []).filter((p) => p.active !== false);
  if (!$('showDone').checked) list = list.filter((p) => p.stage !== '완료');
  if (q) list = list.filter((p) =>
    (p.name + ' ' + p.client).toLowerCase().includes(q));

  // KPI
  const active = list.filter((p) => p.stage !== '완료');
  const soon = active.filter((p) => p.due &&
    dday(new Date(p.due + 'T00:00:00')).left <= 7);
  const amount = active.reduce((a, p) => a + (p.amount || 0), 0);
  const tasksLeft = (WCT.data.tasks || []).filter((t) => !t.done).length;
  $('kpi').innerHTML = `
    <div><span>진행 중</span><b>${active.length}건</b></div>
    <div><span>이번 주 마감</span><b style="${soon.length ? 'color:var(--warn)' : ''}">${soon.length}건</b></div>` +
    (WCT.isAdmin()
      ? `<div><span>진행 중 계약금액</span><b>${won(amount)}원</b></div>`
      : `<div><span>남은 작업</span><b>${tasksLeft}개</b></div>`);

  $('board').innerHTML = STAGES.map((s) => {
    const items = list.filter((p) => (p.stage || '프리') === s.key)
      .sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999'));
    return `<div class="col" data-stage="${s.key}">
      <div class="ch">
        <span class="dot" style="background:${s.color}"></span>
        <span class="cn">${s.key}</span>
        <span class="cc">${items.length}</span>
      </div>
      ${items.map((p) => card(p)).join('')}
      ${items.length ? '' : '<div class="dim" style="font-size:12px;padding:14px 4px">비어 있음</div>'}
    </div>`;
  }).join('');

  bindDnD();
}

function card(p) {
  const pr = progress(p.id);
  const lb = laborOf(p.name);
  return `<div class="pc" draggable="true" data-id="${p.id}" onclick="openProject(${p.id})">
    <div class="nm">${p.code ? `<span class="chip codechip" style="margin-right:5px">${esc(p.code)}</span>` : ''}${esc(p.name)}</div>
    <div class="cl">${esc(p.client || '클라이언트 미지정')}</div>
    ${pr.total ? `<div class="prog ${pr.pct === 100 ? 'full' : ''}"><i style="width:${pr.pct}%"></i></div>` : ''}
    <div class="mt">
      ${pr.total ? `<span class="chip ${pr.pct === 100 ? 'ok' : ''}">${pr.done}/${pr.total}</span>` : ''}
      ${dueChip(p.due)}
      ${p.owner ? `<span class="chip">${esc(p.owner)}</span>` : ''}
    </div>
    ${(() => {
      if (!WCT.isAdmin()) return '';   // PD 에게는 금액을 보여주지 않습니다
      const mo = moneyOf(p.name);
      const rev = mo.sales || p.amount || 0;
      const cost = lb.gross + mo.purchases;
      if (!rev && !cost) return '';
      const margin = rev - cost;
      return `<div class="amt">${rev ? `매출 ${won(rev)}원` : ''}${rev && cost ? ' · ' : ''}${
        cost ? `원가 ${won(cost)}원` : ''}${rev && cost
          ? ` · <span style="color:${margin >= 0 ? 'var(--ok)' : 'var(--bad)'}">${
              won(margin)}원</span>` : ''}</div>`;
    })()}
  </div>`;
}

// ─────────── 드래그 앤 드롭
function bindDnD() {
  let dragId = null;
  document.querySelectorAll('.pc').forEach((el) => {
    el.addEventListener('dragstart', (e) => {
      dragId = Number(el.dataset.id);
      el.classList.add('drag');
      e.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', () => el.classList.remove('drag'));
  });
  document.querySelectorAll('.col').forEach((col) => {
    col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', () => col.classList.remove('over'));
    col.addEventListener('drop', async (e) => {
      e.preventDefault();
      col.classList.remove('over');
      if (!dragId) return;
      const stage = col.dataset.stage;
      const p = WCT.data.projects.find((x) => x.id === dragId);
      if (!p || p.stage === stage) return;
      p.stage = stage;         // 화면 먼저 반영
      render();
      try { await WCT.api('project.update', { id: dragId, stage }); WCT.syncLater(); }
      catch (err) { toast(err.message, true); await WCT.load(true); render(); }
    });
  });
}

// ─────────── 상세
window.openProject = (id) => {
  const p = WCT.data.projects.find((x) => x.id === id);
  if (!p) return;
  CUR = p;
  $('dTitle').textContent = p.name;
  $('dSub').textContent = `${p.client || '클라이언트 미지정'}${p.start ? ' · 시작 ' + p.start : ''}`;
  $('dStage').value = p.stage || '프리';
  $('dDue').value = p.due || '';
  $('dAmount').value = p.amount || '';
  $('dClient').value = p.client || '';
  $('dOwner').value = p.owner || '';
  $('dCode').value = p.code || '';
  $('dMemo').value = p.memo || '';
  renderFolder();
  $('dMsg').className = 'msg hide';

  const lb = laborOf(p.name);
  const mo = moneyOf(p.name);
  const pr = progress(p.id);
  if (!WCT.isAdmin()) {
    $('dCost').innerHTML = `진행률 <b>${pr.done}/${pr.total}</b> (${pr.pct}%)`;
    $('dAmount').closest('div').style.display = 'none';
    $('dDelete').style.display = 'none';
  }
  const revenue = mo.sales || p.amount || 0;
  const cost = lb.gross + mo.purchases;
  const margin = revenue - cost;
  $('dCost').innerHTML = `
    진행률 <b>${pr.done}/${pr.total}</b> (${pr.pct}%)<br>
    매출 <b>${won(mo.sales)}</b>원 (${mo.salesCount}건)${
      p.amount ? ` · 계약 ${won(p.amount)}원` : ''}<br>
    인건비 <b>${won(lb.gross)}</b>원 (${lb.count}건) ·
    기타매입 <b>${won(mo.purchases)}</b>원 (${mo.purCount}건)<br>
    <span style="color:${margin >= 0 ? 'var(--ok)' : 'var(--bad)'}">
      남은 금액 <b>${won(margin)}</b>원${
        revenue ? ` (${Math.round(margin / revenue * 100)}%)` : ''}</span>
    <br><span style="font-size:11.5px">인건비는 원천징수 &gt; 지급, 매출·매입은 세금계산서에서
    이 프로젝트로 등록한 금액입니다. 공급가액 기준입니다.</span>`;

  renderTasks();
  $('dlg').showModal();
};

function renderTasks() {
  const all = tasksOf(CUR.id);
  $('dTasks').innerHTML = ['프리', '프로덕션', '포스트'].map((st) => {
    const list = all.filter((t) => t.stage === st).sort((a, b) => a.order - b.order || a.id - b.id);
    if (!list.length) return '';
    const done = list.filter((t) => t.done).length;
    return `<div class="stagehd">${st} <span class="ln"></span>
      <span class="dim" style="font-weight:400">${done}/${list.length}</span></div>` +
      list.map((t) => `<div class="task ${t.done ? 'on' : ''}">
        <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${t.id}, this.checked)">
        <div class="tx">
          <div>${esc(t.title)}</div>
          <div class="tmeta">
            <input type="date" class="tdue" title="마감일" value="${esc(t.due || '')}"
              onchange="setTaskDue(${t.id}, this.value)">
            <label class="tcal ${t.cal ? 'on' : ''}" title="캘린더에 표시">
              <input type="checkbox" ${t.cal ? 'checked' : ''}
                onchange="setTaskCal(${t.id}, this.checked)">
              <span>📅 캘린더</span>
            </label>
            ${t.cal ? `<select class="tsel" title="넣을 캘린더" onchange="setTaskField(${t.id}, 'calName', this.value)">
                <option value="">자동 · ${esc(guessCal(t.title))}</option>
                ${CALS.map((c) => `<option ${t.calName === c ? 'selected' : ''}>${c}</option>`).join('')}
              </select>
              <span class="dim" style="font-size:10.5px" title="여러 날에 걸친 일이면 시작일도 적어요">구간 시작</span>
              <input type="date" class="tstart" title="여러 날이면 시작일 (비우면 마감일 하루)"
                value="${esc(t.start || '')}" onchange="setTaskField(${t.id}, 'start', this.value)">` : ''}
          </div>
        </div>
        <button class="x" onclick="delTask(${t.id})">×</button>
      </div>`).join('');
  }).join('') || '<div class="dim" style="margin-top:16px;font-size:12.5px">작업이 없습니다. 아래에서 추가하세요.</div>';
}

window.toggleTask = async (id, done) => {
  const t = WCT.data.tasks.find((x) => x.id === id);
  if (t) t.done = done;
  renderTasks(); render();                 // 화면은 즉시
  try { await WCT.api('task.set', { id, done }); WCT.syncLater(); }
  catch (e) { toast(e.message, true); await WCT.load(true); renderTasks(); render(); }
};

window.setTaskDue = async (id, due) => {
  const t = WCT.data.tasks.find((x) => x.id === id);
  if (t) t.due = due;
  try { await WCT.api('task.set', { id, due }); WCT.syncLater(); }
  catch (e) { toast(e.message, true); await WCT.load(true); renderTasks(); }
};

window.setTaskCal = async (id, cal) => {
  const t = WCT.data.tasks.find((x) => x.id === id);
  if (t) t.cal = cal;
  renderTasks();
  try {
    await WCT.api('task.set', { id, cal });
    WCT.syncLater();
    if (cal && !(t && t.due)) {
      toast('마감일을 정해야 캘린더에 들어갑니다.', true);
    }
  } catch (e) { toast(e.message, true); await WCT.load(true); renderTasks(); }
};

window.setTaskField = async (id, key, val) => {
  const t = WCT.data.tasks.find((x) => x.id === id);
  if (t) t[key] = val;
  if (key === 'start' && t && val && t.due && val > t.due) toast('시작일이 마감일보다 늦어요.', true);
  try { await WCT.api('task.set', { id, [key]: val }); WCT.syncLater(); }
  catch (e) { toast(e.message, true); await WCT.load(true); renderTasks(); }
};

// ─────────── 의뢰 폴더
function renderFolder() {
  const p = CUR;
  const box = $('dFolder');
  if (p.folder) {
    box.innerHTML = `📁 <code>1. 의뢰/${esc(p.folder)}</code>
      <button class="g sm" onclick="copyFolder()">경로 복사</button>
      <span style="flex:1"></span>
      <button class="g sm" onclick="unlinkFolder()" title="폴더는 지우지 않고 연결만 끊어요">연결 끊기</button>`;
  } else {
    box.innerHTML = `<span class="dim">📁 연결된 의뢰 폴더가 없어요</span><span style="flex:1"></span>
      <button class="b sm" onclick="makeFolder()">폴더 만들기</button>
      <button class="g sm" onclick="openLink()">기존 폴더 연결</button>`;
  }
}
window.copyFolder = async () => {
  const okc = await copyText('1. 의뢰/' + CUR.folder);
  toast(okc ? '경로를 복사했어요.' : '복사하지 못했어요.', !okc);
};
window.makeFolder = async () => {
  const code = normCode($('dCode').value) || CUR.code || '';
  if (code !== (CUR.code || '')) { toast('코드를 바꿨으면 먼저 저장해 주세요.', true); return; }
  const def = folderNameOf(code, CUR.name);
  const name = prompt('만들 폴더 이름 (1. 의뢰 / 올해 안)\n색보정 단독이면 이름 끝에 그대로 두고 다음 질문에서 고르세요.', def);
  if (!name) return;
  const colorOnly = confirm('색보정 단독 의뢰인가요?\n\n확인 = 00_ADMIN · 20_IN · 30_WORK · 40_OUT 만\n취소 = 전체 구조');
  try {
    const r = await WCT.api('folder.make', { id: CUR.id, folderName: name, colorOnly });
    CUR.folder = r.folder; renderFolder(); WCT.syncLater();
    toast('폴더를 만들었어요: ' + r.folder);
  } catch (e) { toast(e.message, true); }
};
window.unlinkFolder = async () => {
  if (!confirm('이 프로젝트와 폴더의 연결만 끊습니다. NAS 폴더는 그대로 남아요.')) return;
  try { await WCT.api('folder.link', { id: CUR.id, folder: '' }); CUR.folder = ''; renderFolder(); WCT.syncLater(); }
  catch (e) { toast(e.message, true); }
};
async function loadFolders(year) {
  $('lFolder').innerHTML = '<option>불러오는 중…</option>';
  const r = await WCT.api('folder.list', { year });
  $('lYear').innerHTML = r.years.map((y) => `<option ${y === r.year ? 'selected' : ''}>${y}</option>`).join('');
  const used = new Set((WCT.data.projects || []).map((p) => p.folder).filter(Boolean));
  $('lFolder').innerHTML = r.folders.length
    ? r.folders.map((f) => `<option value="${esc(f)}">${esc(f.split('/')[1])}${used.has(f) ? ' (연결됨)' : ''}</option>`).join('')
    : '<option value="">폴더가 없어요</option>';
}
window.openLink = async () => {
  $('lMsg').className = 'msg hide';
  $('linkDlg').showModal();
  try { await loadFolders(''); } catch (e) { $('lMsg').className = 'msg bad'; $('lMsg').textContent = e.message; }
};
$('lSave').onclick = async () => {
  const folder = $('lFolder').value;
  if (!folder) return;
  try {
    const r = await WCT.api('folder.link', { id: CUR.id, folder });
    CUR.folder = r.folder; renderFolder(); WCT.syncLater();
    $('linkDlg').close();
  } catch (e) { $('lMsg').className = 'msg bad'; $('lMsg').textContent = e.message; }
};

window.delTask = async (id) => {
  if (!confirm('이 작업을 삭제할까요?')) return;
  await WCT.api('task.delete', { id });
  await WCT.load(true); renderTasks(); render();
};

async function addTask() {
  const title = $('newTask').value.trim();
  if (!title || !CUR) return;
  const stage = $('newTaskStage').value;
  $('newTask').value = '';
  try {
    const r = await WCT.api('task.add', { projectId: CUR.id, stage, title, order: 999 });
    // 서버를 다시 읽지 않고 화면에만 먼저 더합니다
    WCT.data.tasks.push({ id: r.id, projectId: CUR.id, stage, title,
      assignee: '', due: '', done: false, order: 999, cal: false });
    renderTasks(); render();
    WCT.syncLater();
  } catch (e) { toast(e.message, true); }
}

$('dSave').onclick = async () => {
  const m = $('dMsg');
  const btn = $('dSave');
  const code = normCode($('dCode').value);
  const dup = codeTaken(code, CUR.id);
  if (dup && !confirm(`코드 ${code} 는 '${dup.name}' 에서 이미 쓰고 있어요. 그래도 쓸까요?`)) return;
  btn.disabled = true; btn.textContent = '저장 중…';
  try {
    await WCT.api('project.update', {
      id: CUR.id, name: CUR.name, client: $('dClient').value.trim(), code,
      stage: $('dStage').value, due: $('dDue').value,
      amount: Number(String($('dAmount').value).replace(/[^\d]/g, '')) || 0,
      owner: $('dOwner').value.trim(), memo: $('dMemo').value,
    });
    await WCT.load(true); render();
    m.className = 'msg ok'; m.textContent = '저장했습니다.';
    setTimeout(() => $('dlg').close(), 700);
  } catch (e) { m.className = 'msg bad'; m.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = '저장'; }
};

$('dDelete').onclick = async () => {
  const lb = laborOf(CUR.name);
  if (lb.count && !confirm(
    `이 프로젝트로 등록된 지급 기록이 ${lb.count}건 있습니다.\n` +
    `지급 기록은 남지만 프로젝트 연결이 끊깁니다.\n\n계속할까요?`)) return;
  if (!confirm('프로젝트와 작업이 모두 삭제됩니다. 되돌릴 수 없습니다.')) return;
  await WCT.api('project.delete', { id: CUR.id });
  await WCT.load(true); render();
  $('dlg').close();
};

// ─────────── 새 프로젝트
$('nSave').onclick = async () => {
  const name = $('nName').value.trim();
  const m = $('nMsg');
  if (!name) { m.className = 'msg bad'; m.textContent = '프로젝트명을 입력하세요.'; return; }
  const code = normCode($('nCode').value);
  if (code && !/^[A-Z0-9]{2,6}$/.test(code)) {
    m.className = 'msg bad'; m.textContent = '코드는 영문 대문자·숫자 2~6글자로 적어 주세요.'; return;
  }
  const dup = codeTaken(code);
  if (dup && !confirm(`코드 ${code} 는 '${dup.name}' 에서 이미 쓰고 있어요. 그래도 쓸까요?`)) return;
  const makeFolder = $('nMakeFolder').checked;
  if (makeFolder && !code && !confirm('코드 없이 폴더를 만들까요? (이름: ' + $('nFolderName').value + ')')) return;
  const btn = $('nSave');
  btn.disabled = true; btn.textContent = '만드는 중…';
  try {
    const tasks = $('nTemplate').checked
      ? Object.entries(TEMPLATE).flatMap(([stage, arr]) =>
          arr.map((raw) => Object.assign({ stage }, parseTask(raw))))
      : [];
    const r = await WCT.api('project.add', {
      name, client: $('nClient').value.trim(), stage: '프리', code,
      makeFolder, folderName: $('nFolderName').value.trim(), colorOnly: $('nColorOnly').checked,
      start: $('nStart').value, due: $('nDue').value,
      amount: Number(String($('nAmount').value).replace(/[^\d]/g, '')) || 0,
      tasks,
    });
    ['nName', 'nClient', 'nDue', 'nAmount', 'nCode', 'nFolderName'].forEach((i) => ($(i).value = ''));
    $('nColorOnly').checked = false;
    await WCT.load(true); render();
    $('newDlg').close();
    if (r.folderError) alert('프로젝트는 만들었지만 폴더는 못 만들었어요.\n\n' + r.folderError +
      '\n\n프로젝트를 열어서 [폴더 만들기]로 다시 해 보세요.');
    else if (r.folder) toast('NAS에 폴더를 만들었어요: ' + r.folder);
  } catch (e) { m.className = 'msg bad'; m.textContent = e.message; }
  finally { btn.disabled = false; btn.textContent = '만들기'; }
};
</script>
