# 업무 허브 저장 서버 — QNAP Container Station 의 기존 color-diary 앱에 추가하거나,
# 새 앱 "mgrm-hub" 로 만들어 붙여넣기.
# 바꿀 곳: STORE_TOKEN, DATA_KEY, QNAP_URL, (GAS_URL), 그리고 터널은 기존 것을 씁니다.
services:
  hub-store:
    image: node:22-alpine
    container_name: mgrm-hub-store
    restart: unless-stopped
    command: ["node", "--no-warnings", "/app/server.js"]
    environment:
      - STORE_TOKEN=여기에_허브용_저장열쇠_32자이상      # 컬러다이어리 것과 다르게!
      - DATA_KEY=여기에_데이터열쇠_32자이상               # 개인키를 잠그는 열쇠. 한 번 정하면 바꾸지 말 것
      - QNAP_URL=http://192.168.0.10:8080                # NAS 내부 주소 + 관리 포트 (로그인 확인용)
      - HUB_ADMIN_GROUP=hub-admin
      - HUB_STAFF_GROUP=hub-staff
      - GAS_URL=https://script.google.com/macros/s/AKfycbzSRu7J20klkUFYE8lfx1qf_C6SLolq0g-p_fhHfGmQKreUSDNkbQSh8bQn63JvL3bu/exec
      - DATA_DIR=/data
      - GROUP_FILE=/qnap/config/group,/qnap/group
      - REVIEW_DIR=/web/review
    volumes:
      - /share/Container/mgrm-hub/server.js:/app/server.js:ro
      - /share/HubData:/data                 # 허브 데이터 (QNAP admin 만 접근하는 공유 폴더로 만들 것)
      - /etc/config:/qnap/config:ro            # QNAP 그룹 목록 (읽기 전용) — 허브 그룹 확인용
      - /share/Web:/web                        # 리뷰 영상 폴더 (QNAP 웹 서버가 :8081/review/ 로 내보냄)
