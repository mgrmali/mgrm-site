<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<title>납품 — 컬러리버브 Color Reverb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
/* ═══════════════════════════════════════════
   설정은 파일 맨 아래 ENDPOINT 한 줄뿐입니다.
   파일 목록은 구글 시트 '납품파일' 탭에서 관리합니다.
   ═══════════════════════════════════════════ */
:root{
  color-scheme:dark;
  --ink:#0A0A0C;
  --panel:#141419;
  --panel-2:#1C1C23;
  --line:#2A2A33;
  --text:#F2F0F5;
  --muted:#9B96A6;
  --muted-2:#C9C4D4;
  --accent:#F2749E;
  --ci:linear-gradient(100deg,#E84278,#A63285 52%,#482583);
  --display:'Montserrat',sans-serif;
  --sans:'Pretendard Variable',Pretendard,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:inherit}

/* 헤더 — review.html 과 동일 */
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:14px clamp(16px,3vw,28px);border-bottom:1px solid var(--line)}
.head__brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.head__brand img{height:16px;width:auto;display:block}
.head__brand span{font-family:var(--display);font-size:11px;font-weight:700;
  letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.head__meta{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--muted);text-align:right}
.head__meta b{color:var(--text);font-weight:600}

/* 본문 */
.wrap{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,40px) clamp(16px,3vw,28px)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.top h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em}
.top .exp{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted)}
.top .exp b{color:var(--accent);font-weight:600}
.note{font-size:14px;color:var(--muted);margin:0 0 24px;white-space:pre-wrap}
.banner{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:12px 16px;
  font-size:14px;color:var(--muted-2);margin:0 0 18px;display:none}
.banner b{color:var(--text)}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:12px 16px;margin:0 0 14px}
.who label{font-size:13.5px;color:var(--muted-2);flex:1;min-width:200px}
.who input{width:240px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:9px 12px;font-family:inherit;font-size:14px}
.who.ok{border-color:var(--accent)}
.btn.is-off{opacity:.4;cursor:not-allowed}

/* 파일 카드 */
.files{display:flex;flex-direction:column;gap:10px}
.file{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;transition:.18s}
.file:hover{border-color:var(--accent);background:var(--panel-2)}
.file__kind{font-family:var(--display);font-size:10.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent)}
.file__name{margin:4px 0 0;font-family:var(--mono);font-size:14px;font-weight:600;word-break:break-all}
.file__spec{margin:6px 0 0;font-size:13px;color:var(--muted-2)}
.file__row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:12px}
.file__meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.file__hash{display:inline-flex;align-items:center;gap:6px}
.file__hash code{font-family:inherit;color:var(--muted-2);word-break:break-all}
.copy{font-family:var(--display);font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;transition:.18s}
.copy:hover{color:var(--text);border-color:var(--accent)}
.file__done{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}

/* 버튼 */
.btn{font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:10px 16px;border-radius:999px;
  border:1px solid var(--line);background:transparent;color:var(--muted-2);cursor:pointer;transition:.2s;
  display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.btn:hover{color:var(--text);border-color:var(--accent)}
.btn-fill{background:var(--ci);border-color:transparent;color:#fff}
.btn-fill:hover{filter:brightness(1.1)}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* 수령 확인 */
.confirm{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.confirm h2{margin:0 0 4px;font-size:14px;font-weight:700}
.confirm p{margin:0 0 12px;font-size:13px;color:var(--muted)}
.confirm__row{display:flex;gap:9px;flex-wrap:wrap}
.confirm input{flex:1;min-width:160px;background:var(--panel);border:1px solid var(--line);border-radius:9px;
  color:var(--text);padding:10px 12px;font-family:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--accent)}
::placeholder{color:#6E6A79}
.status{margin:9px 0 0;font-size:13px;color:var(--muted);min-height:18px}
.status.err{color:var(--accent)}
.status.ok{color:var(--muted-2)}
.contact{margin-top:28px;font-size:12.5px;color:var(--muted);font-family:var(--mono);letter-spacing:.04em}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:36px 10px;line-height:1.7}

/* 잠금 — review.html 과 동일 */
.gate{position:fixed;inset:0;z-index:50;background:var(--ink);display:grid;place-items:center;padding:24px}
.gate.off{display:none}
.gate__box{width:100%;max-width:380px;text-align:center}
.gate__box img{height:22px;margin-bottom:26px}
.gate__box h1{font-size:21px;font-weight:700;margin:0 0 8px;letter-spacing:-.02em}
.gate__box p{color:var(--muted);font-size:14.5px;margin:0 0 22px;white-space:pre-wrap}
.gate__box input{width:100%;text-align:center;letter-spacing:.2em;font-family:var(--mono);
  background:var(--panel);border:1px solid var(--line);border-radius:9px;color:var(--text);padding:10px 12px;font-size:14px}
.gate__box .btn{width:100%;margin-top:10px;padding:13px}

@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.who.shake{animation:shake .4s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<!-- 잠금 -->
<div class="gate" id="gate">
  <div class="gate__box">
    <img src="logo.png" alt="맹그라미">
    <h1 id="gateTitle">납품 링크</h1>
    <p id="gateDesc">전달받은 비밀번호를 입력해주세요.</p>
    <input type="password" id="pw" placeholder="••••••" autocomplete="off">
    <button class="btn btn-fill" id="unlock">열기</button>
    <p class="status" id="gateStatus"></p>
  </div>
</div>

<header class="head">
  <a class="head__brand" href="https://mgrm.kr/color.html">
    <img src="logo.png" alt="">
    <span>Color Reverb · Delivery</span>
  </a>
  <div class="head__meta">
    <b id="mTitle">—</b><br><span id="mVer">—</span>
  </div>
</header>

<main class="wrap">
  <div class="top">
    <h1>납품 파일</h1>
    <div class="exp" id="exp"></div>
  </div>
  <p class="note" id="note"></p>
  <p class="banner" id="banner"></p>

  <div class="who" id="whoBox">
    <label for="who">이름과 소속을 적으면 내려받기가 열립니다. 누가 받았는지 기록하기 위한 것입니다.</label>
    <input type="text" id="who" placeholder="이름 / 소속" autocomplete="name">
  </div>

  <div class="files" id="files">
    <p class="empty">등록된 파일이 없습니다.</p>
  </div>

  <section class="confirm">
    <h2>파일 수령 확인</h2>
    <p>모든 파일을 정상적으로 받으셨으면 확인을 눌러주세요. 위에 적은 이름으로 납품 완료가 기록됩니다.</p>
    <div class="confirm__row">
      <button class="btn btn-fill" id="confirmBtn">수령 확인</button>
    </div>
    <p class="status" id="status"></p>
  </section>

  <p class="contact">문의 · wlsdnr601@mgrm.kr · 010-9982-6230</p>
</main>

<script>
/* ═══════════════════════════════════════════
   설정은 이 한 줄뿐입니다. review.html 과 같은 주소를 씁니다.
   ═══════════════════════════════════════════ */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxMgNVVuNMrzjTKSyXSd_lG4YI2BcBD0QI7-rh25Jv0J1xZr2qEB7PTS9CEzkes7bAF5g/exec";

const $ = s => document.querySelector(s);
const key = new URLSearchParams(location.search).get('p') || '';
let P = null;

/* 앱스스크립트 호출 (JSONP — review.html 과 동일) */
function ask(params){
  return new Promise((resolve, reject) => {
    const cb = 'cb_' + Math.random().toString(36).slice(2);
    const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, 15000);
    function cleanup(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    const q = Object.entries(params).map(([k, val]) =>
      encodeURIComponent(k) + '=' + encodeURIComponent(val)).join('&');
    const sc = document.createElement('script');
    sc.src = ENDPOINT + '?' + q + '&callback=' + cb;
    sc.onerror = () => { cleanup(); reject(new Error('load')); };
    document.head.appendChild(sc);
  });
}

async function post(payload){
  const opts = {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  };
  try{ await fetch(ENDPOINT, opts); return true; }
  catch(e){
    try{ await fetch(ENDPOINT, {...opts, mode:'no-cors'}); return true; }
    catch(e2){ return false; }
  }
}

/* 진입 */
(async function init(){
  if(!key){ lock('링크를 확인해주세요', '유효하지 않은 주소입니다.'); return; }
  try{
    const r = await ask({ mode: 'dmeta', p: key });
    if(!r.ok){
      lock(r.title || '열 수 없는 링크',
        r.error === 'expired'  ? '이 납품 링크는 만료되었습니다.\n재발급이 필요하시면 연락 주세요.'
        : r.error === 'notready' ? '아직 납품 준비 중입니다.\n준비가 끝나면 다시 안내드리겠습니다.'
        : r.error === 'off'      ? '이 링크는 현재 닫혀 있습니다.'
        : '유효하지 않은 주소입니다.\n전달받은 링크를 다시 확인해주세요.');
      return;
    }
    $('#gateTitle').textContent = r.title;
    $('#mTitle').textContent = r.title;
    $('#mVer').textContent = r.ver || '';
    document.title = r.title + ' — 컬러리버브 납품';
    if(!r.need) enter('');            // 비밀번호가 없는 프로젝트
  }catch(e){
    lock('연결할 수 없습니다', '잠시 후 다시 시도해주세요.');
  }
})();

function lock(title, desc){
  $('#gateTitle').textContent = title;
  $('#gateDesc').textContent = desc;
  $('#pw').style.display = 'none';
  $('#unlock').style.display = 'none';
}

/* 비밀번호 확인 후 파일 목록을 받아온다 */
async function enter(pw){
  $('#gateStatus').className = 'status';
  $('#gateStatus').textContent = '확인 중…';
  try{
    const r = await ask({ mode: 'dopen', p: key, pw: pw });
    if(!r.ok){
      $('#gateStatus').className = 'status err';
      $('#gateStatus').textContent = r.error === 'pw'
        ? '비밀번호가 맞지 않습니다.' : '열 수 없습니다.';
      return;
    }
    P = r;
    $('#mTitle').textContent = r.title;
    $('#mVer').textContent = r.ver || '';
    $('#exp').innerHTML = r.expires ? '링크 만료 <b>' + r.expires + '</b>' : '';
    $('#note').textContent = r.note || '';
    if(r.received){
      const b = $('#banner');
      b.innerHTML = '<b>' + escape_(r.received.who) + '</b> 님이 ' + escape_(r.received.at) + ' 에 수령 확인하셨습니다.';
      b.style.display = 'block';
      $('#confirmBtn').setAttribute('disabled', '');
      $('#confirmBtn').textContent = '수령 확인됨';
    }
    renderFiles(r.files || []);
    $('#gate').classList.add('off');
  }catch(e){
    $('#gateStatus').className = 'status err';
    $('#gateStatus').textContent = '연결에 실패했습니다. 잠시 후 다시 시도해주세요.';
  }
}

function escape_(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

$('#unlock').addEventListener('click', () => enter($('#pw').value));
$('#pw').addEventListener('keydown', e => { if(e.key === 'Enter') $('#unlock').click(); });

/* 파일 목록 */
function renderFiles(files){
  const box = $('#files');
  box.innerHTML = '';
  if(!files.length){
    box.innerHTML = '<p class="empty">등록된 파일이 없습니다.<br>파일이 준비되면 다시 안내드리겠습니다.</p>';
    return;
  }

  files.forEach(f => {
    const d = document.createElement('div'); d.className = 'file';

    const kind = document.createElement('div'); kind.className = 'file__kind'; kind.textContent = f.kind || '파일';
    const name = document.createElement('p');  name.className = 'file__name'; name.textContent = f.name;
    d.append(kind, name);

    if(f.spec){
      const s = document.createElement('p'); s.className = 'file__spec'; s.textContent = f.spec;
      d.appendChild(s);
    }

    const row  = document.createElement('div'); row.className = 'file__row';
    const meta = document.createElement('div'); meta.className = 'file__meta';
    if(f.size){ const z = document.createElement('span'); z.textContent = f.size; meta.appendChild(z); }
    if(f.hash){
      const h = document.createElement('span'); h.className = 'file__hash';
      const c = document.createElement('code'); c.textContent = f.hash;
      const b = document.createElement('button'); b.className = 'copy'; b.type = 'button'; b.textContent = '복사';
      b.addEventListener('click', async () => {
        try{
          await navigator.clipboard.writeText(f.hash);
          b.textContent = '복사됨'; setTimeout(() => b.textContent = '복사', 1500);
        }catch(e){}
      });
      h.append(c, b); meta.appendChild(h);
    }

    const dl = document.createElement('a');
    dl.className = 'btn btn-fill dl';
    dl.textContent = '내려받기';
    dl.href = f.url; dl.target = '_blank'; dl.rel = 'noopener';
    dl.addEventListener('click', (ev) => {
      if(!hasName()){
        ev.preventDefault();
        $('#who').focus();
        $('#whoBox').classList.add('shake');
        setTimeout(() => $('#whoBox').classList.remove('shake'), 400);
        return;
      }
      // 기록만 남기고 다운로드는 그대로 진행 (실패해도 막지 않음)
      post({ '_폼종류':'납품기록', '프로젝트키':key, '작품명':P ? P.title : '',
             '이름':$('#who').value.trim(), '작업':'다운로드', '파일명':f.name });
      let done = d.querySelector('.file__done');
      if(!done){ done = document.createElement('span'); done.className = 'file__done'; meta.appendChild(done); }
      done.textContent = '받기 시작 ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'});
    });

    row.append(meta, dl);
    d.appendChild(row);
    box.appendChild(d);
  });
  gateDownloads();
}

/* 이름을 적어야 내려받기가 열린다 */
function hasName(){ return $('#who').value.trim().length > 0; }
function gateDownloads(){
  const ok = hasName();
  $('#whoBox').classList.toggle('ok', ok);
  document.querySelectorAll('a.dl').forEach(a => {
    a.classList.toggle('is-off', !ok);
    a.setAttribute('aria-disabled', ok ? 'false' : 'true');
    a.title = ok ? '' : '이름과 소속을 먼저 적어주세요';
  });
}
$('#who').addEventListener('input', gateDownloads);

/* 수령 확인 */
$('#confirmBtn').addEventListener('click', async () => {
  const who = $('#who').value.trim();
  const st = $('#status');
  if(!who){ st.className = 'status err'; st.textContent = '위에 이름과 소속을 먼저 적어주세요.'; $('#who').focus(); return; }
  if(!confirm('모든 파일을 정상적으로 받으셨습니까?\n납품 완료로 기록됩니다.')) return;
  st.className = 'status'; st.textContent = '기록 중…';
  const ok = await post({ '_폼종류':'납품기록', '프로젝트키':key, '작품명':P ? P.title : '',
                          '이름':who, '작업':'수령확인', '파일명':'' });
  if(ok){
    st.className = 'status ok'; st.textContent = '수령 확인이 기록되었습니다. 감사합니다.';
    $('#confirmBtn').setAttribute('disabled', '');
    $('#confirmBtn').textContent = '수령 확인됨';
  }else{
    st.className = 'status err'; st.textContent = '기록에 실패했습니다. 다시 시도해주세요.';
  }
});
</script>
</body>
</html>
